        ]
      status: ''
      nodeMeta:
        aliasName: 代码
        nodeType: 工具
      inputs:
      - id: 07da0c87-3788-5e74-845b-0d871d2a25fd
        name: raw_input
        nameErrMsg: ''
        schema:
          type: string
          value:
            type: ref
            content:
              name: AGENT_USER_INPUT
              id: 31ec4b48-4873-570d-8c36-5ed1df613e13
              nodeId: node-start::1b234a19-2a6b-5dcf-9e06-6db82918e321
            contentErrMsg: ''
        fileType: ''
      outputs:
      - id: b9c82360-809d-530b-b3ea-bbc4f0f86a06
        name: planning_context
        nameErrMsg: ''
        schema:
          type: string
          default: ''
        required: false
      nodeParam:
        uid: '21880654528'
        code: |-
          import json
          import re

          REQUIRED_SECTIONS = [
              "definition_and_boundary",
              "core_principles",
              "example_or_steps",
              "application_or_verification",
          ]


          def _json_object(value, field_name):
              if isinstance(value, dict):
                  for key in ("output", "content", "text", "data"):
                      nested = value.get(key)
                      if nested not in (None, "") and not isinstance(
                          nested, (list, int, float, bool)
                      ):
                          try:
                              return _json_object(nested, field_name)
                          except Exception:
                              pass
                  return value

              text = str(value or "").strip()
              fence = chr(96) * 3
              if text.startswith(fence):
                  first_line_end = text.find(chr(10))
                  if first_line_end >= 0:
                      text = text[first_line_end + 1:]
                  if text.rstrip().endswith(fence):
                      text = text.rstrip()[:-3]
                  text = text.strip()

              start = text.find("{")
              end = text.rfind("}")
              if start < 0 or end < start:
                  raise ValueError(field_name + " 中未找到 JSON 对象")

              try:
                  return json.loads(text[start:end + 1], strict=False)
              except Exception as error:
                  raise ValueError(
                      field_name + " 不是合法 JSON：" + str(error)
                  ) from error


          def main(model_output, planning_context):
              try:
                  result = _json_object(model_output, "大模型输出")
                  context = _json_object(planning_context, "检索规划上下文")

                  point = context.get("knowledge_point")
                  if not isinstance(point, dict):
                      raise ValueError("检索规划上下文缺少 knowledge_point")

                  point_name = str(point.get("knowledge_point_name") or "").strip()
                  allowed_domains = {
                      str(domain).strip().lower()
                      for domain in context.get("allowed_source_domains", [])
                      if str(domain).strip()
                  }
                  queries = result.get("queries")

                  if result.get("status") != "ok":
                      raise ValueError("大模型 status 必须为 ok")
                  if result.get("workflow_mode") != "knowledge_planning":
                      raise ValueError(
                          "大模型 workflow_mode 必须为 knowledge_planning"
                      )
                  if not point_name or not allowed_domains:
                      raise ValueError("检索规划上下文缺少知识点名称或来源白名单")
                  if not isinstance(queries, list) or not 1 <= len(queries) <= 4:
                      raise ValueError("queries 必须为 1 至 4 条数组")

                  normalized_queries = []
                  for item in queries:
                      query = str(item or "").strip()

                      if not query or point_name.casefold() not in query.casefold():
                          raise ValueError("每条检索词必须原样包含当前知识点名称")

                      normalized_query = query.casefold()
                      if (
                          "http://" in normalized_query
                          or "https://" in normalized_query
                          or "www." in normalized_query
                      ):
                          raise ValueError("检索词不得包含 URL")

                      domain_match = re.search(r"site:([a-z0-9.-]+)", query, re.I)
                      if (
                          not domain_match
                          or domain_match.group(1).lower() not in allowed_domains
                      ):
                          raise ValueError(
                              "每条检索词必须使用 allowed_source_domains 中的 site:域名"
                          )

                      query_without_site = query.replace(domain_match.group(0), " ")
                      if not re.search(r"[A-Za-z]{2,}", query_without_site):
                          raise ValueError("每条检索词必须包含英文技术术语")

                      if query not in normalized_queries:
                          normalized_queries.append(query)

                  if not normalized_queries:
                      raise ValueError("queries 不能为空")

                  sections = result.get("required_sections")
                  if (
                      not isinstance(sections, list)
                      or set(sections) != set(REQUIRED_SECTIONS)
                  ):
                      raise ValueError("required_sections 不符合规定的完整讲解结构")

                  output = {
                      "status": "ok",
                      "workflow_mode": "knowledge_planning",
                      "queries": normalized_queries,
                      "required_sections": REQUIRED_SECTIONS,
                  }

              except Exception as error:
                  raw_output = str(model_output or "").strip().replace(chr(10), " ")
                  if not raw_output:
                      raw_output = "【空输出】"

                  output = {
                      "status": "system_retryable",
                      "workflow_mode": "knowledge_planning",
                      "queries": [],
                      "required_sections": REQUIRED_SECTIONS,
                      "reasons": [
                          "检索计划校验失败：" + str(error)[:160],
                          "大模型原始输出：" + raw_output[:500],
                      ],
                  }

              return {
                  "final_result_json": json.dumps(
                      output,
                      ensure_ascii=False,
                      separators=(",", ":"),
                  )
              }
        appId: 6545ca99
        codeErrMsg: ''
