            ]
          }

          要求：

          1. queries 必须为 1 至 4 条互不重复的非空检索词。
          2. 将 knowledge_point.knowledge_point_name 视为不可改写的字面量：每条检索词必须逐字复制并原样包含该完整名称；不得使用同义词、删减、改序、翻译、简繁转换或替换标点。例如名称为“Java 类与对象”时，检索词必须包含“Java 类与对象”，不得写成“Java 类和对象”。
          3. 中文知识点必须同时包含对应的英文技术术语。
          4. 每条检索词必须包含 site:域名。
          5. site: 后面的域名必须来自 allowed_source_domains。
          6. 禁止出现 http://、https:// 或 www.。
          7. 查询应覆盖官方文档、标准、论文或文献等不同角度。
          8. status 固定为 ok。
          9. workflow_mode 固定为 knowledge_planning。
          10. 不得输出 Markdown、解释文字或 JSON 之外的内容。
