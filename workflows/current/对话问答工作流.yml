        required: false
      nodeParam:
        uid: '21880654528'
        code: |-
          import json
          import re

          def _clean_sources(value):
              if not isinstance(value, list):
                  return []
              sources = []
              for item in value[:3]:
                  if not isinstance(item, dict):
                      continue
                  title = str(item.get("title") or "").strip()[:200]
                  locator = str(item.get("locator") or "").strip()[:500]
                  if title or locator:
                      sources.append({"title": title, "locator": locator})
              return sources

          def _redact(text):
              value = str(text or "")
              value = re.sub(r"(?i)(api[_ -]?key|secret|token)\s*[:=]\s*[^\s,;]+", r"\1=[已隐藏]", value)
              value = re.sub(r"\bsk-[A-Za-z0-9_-]{12,}\b", "[已隐藏]", value)
              return value[:4000]

          def main(model_output, message):
              question = str(message or "").strip()[:2000]
              if not question:
                  payload = {"status":"invalid_input","message":"请输入具体问题后再试。","ai_generated":False,"sources":[],"original_question":""}
                  return {"final_result_json": json.dumps(payload, ensure_ascii=False, separators=(",", ":"))}

              fence = chr(96) * 3
              text = str(model_output or "").strip().replace(fence + "json", "").replace(fence, "").strip()
              start, end = text.find("{"), text.rfind("}")
              result = {}
              if start >= 0 and end >= start:
                  try:
                      result = json.loads(text[start:end + 1], strict=False)
                  except Exception:
                      result = {}
              raw_answer = result.get("answer") or result.get("message") or ""
              if not raw_answer and text:
                  raw_answer = text
              answer = _redact(raw_answer)
              if not answer:
                  payload = {"status":"fallback","message":"暂时无法生成有效回答，请稍后重试。","ai_generated":False,"sources":[],"original_question":question}
              else:
                  payload = {"status":"ok","message":answer,"ai_generated":True,"sources":_clean_sources(result.get("sources")),"original_question":question}
              return {"final_result_json": json.dumps(payload, ensure_ascii=False, separators=(",", ":"))}
        appId: 12a0a7e2
        codeErrMsg: ''
      icon: https://oss-beijing-m8.openstorage.cn/SparkBotProd/icon/icon-wrapper-question.svg
