      nodeParam:
        uid: '21880654528'
        code: |-
          import json

          def _parse(raw_input):
              value = raw_input
              for _ in range(4):
                  if isinstance(value, dict):
                      if "input" in value:
                          value = value["input"]
                          continue
                      if "AGENT_USER_INPUT" in value:
                          value = value["AGENT_USER_INPUT"]
                          continue
                      return value
                  if isinstance(value, str):
                      text = value.strip()
                      if not text:
                          return {}
                      try:
                          value = json.loads(text)
                          continue
                      except Exception:
                          return {"message": text}
                  return {}
              return value if isinstance(value, dict) else {}

          def _json_text(value, default):
              if value is None:
                  value = default
              if isinstance(value, str):
                  text = value.strip()
                  if not text:
                      value = default
                  else:
                      try:
                          value = json.loads(text)
                      except Exception:
                          return text
              return json.dumps(value, ensure_ascii=False, separators=(",", ":"))

          def _is_true(value):
              if isinstance(value, bool):
                  return value
              if isinstance(value, (int, float)):
                  return value != 0
              return str(value or "").strip().lower() in ("true", "1", "yes", "on")

          def main(raw_input):
              data = _parse(raw_input)
              message = str(data.get("message") or data.get("question") or "").strip()
              student_id = str(data.get("student_id") or "").strip()
              student_profile = data.get("student_profile", {})
              history = data.get("history_memory", data.get("history", []))
              local_context = data.get("local_context", {})
              local_sources = data.get("local_sources", [])
              source_summary = str(data.get("source_summary") or data.get("kb_text") or "").strip()
              requested = data.get("use_learning_materials")
              if requested is None:
                  requested = any(word in message for word in ("学习资料", "资料", "教材", "来源", "知识库"))
              return {
                  "message": message,
                  "student_id": student_id,
                  "student_profile_json": _json_text(student_profile, {}),
                  "request_id": str(data.get("request_id") or "").strip(),
                  "project_id": str(data.get("project_id") or "").strip(),
                  "session_id": str(data.get("session_id") or "").strip(),
                  "assistant_mode": str(data.get("assistant_mode") or "chat").strip(),
                  "should_query_materials": "true" if _is_true(requested) else "false",
                  "history_json": _json_text(history, []),
                  "local_context_json": _json_text(local_context, {}),
                  "local_sources_json": _json_text(local_sources, []),
                  "source_summary": source_summary
              }
