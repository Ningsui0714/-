        name: audit_context
        nameErrMsg: ''
        schema:
          type: string
          value:
            type: ref
            content:
              name: audit_context
              id: a19ea0f4-1c23-4184-87c0-3b6defc8ec1a
              nodeId: ifly-code::15d099e0-eea7-44bf-89c9-63a9b56a2680
            contentErrMsg: ''
        fileType: ''
      outputs:
      - id: 766b08df-9b82-4ed1-8552-b1335e3f8733
        name: final_result_json
        nameErrMsg: ''
        schema:
          type: string
          default: ''
      nodeParam:
        uid: ''
        code: |
          import json


          def _json_object(value, field_name):
              if isinstance(value, dict):
                  for key in ("output", "content", "text", "data"):
                      nested = value.get(key)
                      if nested not in (None, "") and not isinstance(nested, (list, int, float, bool)):
                          try:
                              return _json_object(nested, field_name)
                          except Exception:
                              pass
                  return value

              text = str(value or "").strip()
              fence = chr(96) * 3
              if text.startswith(fence):
                  first_line_end = text.find("\n")
                  if first_line_end >= 0:
                      text = text[first_line_end + 1:]
                  if text.rstrip().endswith(fence):
                      text = text.rstrip()[:-3]
                  text = text.strip()

              start = text.find("{")
              end = text.rfind("}")
              if start < 0 or end < start:
                  raise ValueError(field_name + " 中未找到 JSON 对象")

              try:
                  return json.loads(text[start:end + 1], strict=False)
              except Exception as exc:
                  raise ValueError(field_name + " 不是合法 JSON：" + str(exc)) from exc


          def _has_trace(block, evidence):
              source = str(block.get("source") or "").strip().casefold()
              if not source:
                  return False

              for item in evidence:
                  if not isinstance(item, dict):
                      continue
                  for key in ("title", "source", "url"):
                      candidate = str(item.get(key) or "").strip().casefold()
                      if candidate and (candidate in source or source in candidate):
                          return True
              return False


          def main(model_output, audit_context):
              try:
                  result = _json_object(model_output, "大模型输出")
                  context = _json_object(audit_context, "审核上下文")

                  if result.get("status") != "ok":
                      raise ValueError("大模型 status 必须为 ok")

                  decision = str(result.get("decision") or "").strip().lower()
                  if decision not in ("approved", "rejected"):
                      raise ValueError("大模型 decision 必须为 approved 或 rejected")

                  model_reasons = result.get("reasons")
                  if not isinstance(model_reasons, list):
                      raise ValueError("大模型 reasons 必须为数组")

                  reasons = [
                      str(item).strip()
                      for item in model_reasons
                      if str(item).strip()
                  ]
                  if not reasons:
                      raise ValueError("大模型 reasons 不能为空")

                  evidence = context.get("evidence")
                  blocks = context.get("content_blocks")
                  local_audit = context.get("local_audit")

                  if not isinstance(evidence, list) or not evidence:
                      raise ValueError("审核上下文 evidence 必须为非空数组")
                  if not isinstance(blocks, list) or not blocks:
                      raise ValueError("审核上下文 content_blocks 必须为非空数组")
                  if not isinstance(local_audit, dict):
                      raise ValueError("审核上下文 local_audit 必须为对象")

                  trace_ok = True
                  for block in blocks:
                      if not isinstance(block, dict):
                          trace_ok = False
                          break
                      if str(block.get("type") or "").strip() == "notice":
                          continue
                      if not _has_trace(block, evidence):
                          trace_ok = False
                          break

                  deterministic_ok = (
                      str(local_audit.get("status") or "").strip().lower() == "passed"
                      and trace_ok
                  )

                  if not deterministic_ok:
                      decision = "rejected"
                      reasons = ["本地审核未通过或存在无法追溯到证据的讲解区块"]

                  output = {
                      "status": "ok",
                      "workflow_mode": "knowledge_audit",
                      "decision": decision,
                      "reasons": reasons[:4],
                  }

              except Exception as exc:
                  raw_output = str(model_output or "").strip().replace("\n", " ")
                  if not raw_output:
                      raw_output = "【空输出】"

                  output = {
                      "status": "system_retryable",
                      "workflow_mode": "knowledge_audit",
                      "decision": "rejected",
                      "reasons": [
                          "审核结论校验失败：" + str(exc)[:160],
                          "大模型原始输出：" + raw_output[:500],
                      ],
                  }

              return {
                  "final_result_json": json.dumps(
                      output,
                      ensure_ascii=False,
                      separators=(",", ":"),
                  )
              }
        appId: ''
        handlingEdge: normal_one_of::6366f503-52ce-47c1-afef-af958bb2b1b3
        setAnswerContentErrMsg: ''
        exceptionHandlingEdge: fail_one_of::4dfaa9b5-45b2-4bae-8292-cbda5255b60d
        codeErrMsg: ''
      retryConfig:
        shouldRetry: true
        customOutput: |-
          {
            "final_result_json": "{\"status\":\"system_retryable\",\"workflow_mode\":\"knowledge_audit\",\"decision\":\"rejected\",\"reasons\":[\"审核结论节点执行失败，请稍后重试\"]}"
          }
        errorStrategy: 1
      icon: https://oss-beijing-m8.openstorage.cn/SparkBotProd/icon/icon-wrapper-question.svg
      description: 面向开发者提供代码开发能力，目前仅支持python语言，允许使用该节点已定义的变量作为参数传入，返回语句用于输出函数的结果
      updatable: false
