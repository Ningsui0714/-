        name: audit_context
        nameErrMsg: ''
        schema:
          type: string
          properties: [
            ]
          default: ''
      nodeParam:
        uid: ''
        code: |-
          import json

          def _parse(raw_input):
              value = raw_input
              for _ in range(3):
                  if isinstance(value, dict):
                      value = value.get("input", value.get("AGENT_USER_INPUT", value))
                      if isinstance(value, dict):
                          return value
                      continue
                  text = str(value or "").strip()
                  if not text:
                      raise ValueError("AGENT_USER_INPUT 不能为空")
                  value = json.loads(text, strict=False)
              if not isinstance(value, dict):
                  raise ValueError("输入必须是 JSON 对象")
              return value

          def main(raw_input):
              data = _parse(raw_input)
              evidence = data.get("evidence")
              blocks = data.get("content_blocks")
              local_audit = data.get("local_audit")
              if not isinstance(evidence, list) or not evidence:
                  raise ValueError("evidence 必须是非空数组")
              if not isinstance(blocks, list) or not blocks:
                  raise ValueError("content_blocks 必须是非空数组")
              if not isinstance(local_audit, dict):
                  raise ValueError("local_audit 必须是对象")
              for item in evidence:
                  if not isinstance(item, dict) or not all(str(item.get(key) or "").strip() for key in ("title", "url", "quote")):
                      raise ValueError("每条 evidence 必须包含 title、url 和 quote")
              for block in blocks:
                  if not isinstance(block, dict) or not str(block.get("type") or "").strip() or not str(block.get("source") or "").strip():
                      raise ValueError("每个 content_block 必须包含 type 和 source")
              context = {"evidence": evidence, "content_blocks": blocks, "local_audit": local_audit}
              return {"audit_context": json.dumps(context, ensure_ascii=False, separators=(",", ":"))}
        appId: ''
        codeErrMsg: ''
      icon: https://oss-beijing-m8.openstorage.cn/SparkBotProd/icon/icon-wrapper-question.svg
