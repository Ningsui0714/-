                  nodeId: node-start::4c6cd3b7-8b5e-52e7-a1c6-0da32c667620
                contentErrMsg: ''
            nameErrMsg: ''
            fileType: ''
        outputs:
          - id: 2a903e54-78d3-5940-8d1d-999e969820c3
            name: context_json
            schema: {type: string, default: ''}
            nameErrMsg: ''
            required: false
          - id: 61ef823a-afc5-5246-b0e9-f3397380ad9e
            name: strategy_json
            schema: {type: string, default: ''}
            nameErrMsg: ''
            required: false
          - id: eb3574e7-ba1b-531d-bcbc-6fe357ccf98f
            name: student_profile_json
            schema: {type: string, default: ''}
            nameErrMsg: ''
            required: false
          - id: 134e2161-598f-57d2-b584-4b7943396441
            name: kb_text
            schema: {type: string, default: ''}
            nameErrMsg: ''
            required: false
        nodeParam:
          code: |-
            import json


            def _parse_input(raw_input):
                value = raw_input
                for _ in range(3):
                    if isinstance(value, dict):
                        if "input" in value:
                            value = value.get("input")
                            continue
                        if "AGENT_USER_INPUT" in value:
                            value = value.get("AGENT_USER_INPUT")
                            continue
                        return value
                    text = str(value or "").strip()
                    if not text:
                        return {}
                    value = json.loads(text, strict=False)
                if not isinstance(value, dict):
                    raise ValueError("输入必须是 JSON 对象或 JSON 字符串")
                return value


            def main(raw_input):
                data = _parse_input(raw_input)
                if not isinstance(data, dict):
                    raise ValueError("输入必须是 JSON 对象")
                student_id = str(data.get("student_id") or "").strip()
                student_profile = data.get("student_profile", {})
                if not isinstance(student_profile, dict):
                    student_profile = {}
                knowledge_state = data.get("knowledge_state", {})
                if not isinstance(knowledge_state, dict):
                    knowledge_state = {}
                recent_events = data.get("recent_events", [])
                if not isinstance(recent_events, list):
                    recent_events = []
                learning_goal = data.get("learning_goal", {})
                if not isinstance(learning_goal, dict):
                    learning_goal = {}
                items = knowledge_state.get("items", [])
                if not isinstance(items, list):
                    items = knowledge_state.get("learning_path", {}).get("items", [])
                if not isinstance(items, list):
                    items = []
                candidates = []
                for item in items:
                    if not isinstance(item, dict):
                        continue
                    item_id = str(item.get("knowledge_point_id", "")).strip()
                    if not item_id:
                        continue
                    title = str(item.get("knowledge_point_name") or item_id)
                    mastery = max(0, min(100, int(item.get("mastery", 0) or 0)))
                    wrong_streak = max(0, int(item.get("wrong_streak", 0) or 0))
                    status = str(item.get("status") or "pending")
                    if mastery < 60:
                        candidate_type = "remediate"
                        evidence = "掌握度仅 " + str(mastery) + "%"
                    elif wrong_streak >= 2:
                        candidate_type = "practice"
                        evidence = "连续 " + str(wrong_streak) + " 次同类错误"
                    elif mastery < 80 or status == "current":
                        candidate_type = "practice"
                        evidence = "当前掌握度 " + str(mastery) + "%，需要情境练习巩固"
                    elif status not in {"completed", "mastered"}:
                        candidate_type = "advance"
                        evidence = "掌握度已达 " + str(mastery) + "%，可进入迁移任务"
                    else:
                        candidate_type = "review"
                        evidence = "已完成节点，建议间隔复习保持掌握"
                    candidates.append({
                        "type": candidate_type,
                        "knowledge_point_id": item_id,
                        "title": title,
                        "priority_hint": len(candidates) + 1,
                        "evidence": evidence,
                    })
                recent_missed = set()
                for event in recent_events:
                    if isinstance(event, dict) and str(event.get("effect", "")).lower() in {"not_understood", "incorrect"}:
                        knowledge_id = str(event.get("knowledge_point_id", "")).strip()
                        if knowledge_id:
                            recent_missed.add(knowledge_id)
                for knowledge_id in sorted(recent_missed):
                    for candidate in candidates:
                        if candidate["knowledge_point_id"] == knowledge_id:
                            candidate["priority_hint"] = 0
                            candidate["evidence"] += "；近期仍出现未理解或答错反馈"
                            break
                candidates.sort(key=lambda item: (item["priority_hint"], item["knowledge_point_id"]))
                context = {
                    "student_id": student_id,
                    "student_profile": student_profile,
                    "knowledge_state": knowledge_state,
                    "recent_events": recent_events,
                    "learning_goal": learning_goal,
                    "rule_candidates": candidates[:8],
                }
                return {
                    "context_json": json.dumps(context, ensure_ascii=False, separators=(",", ":")),
                    "strategy_json": json.dumps({"source": "rule_candidates", "count": len(candidates[:8])}, ensure_ascii=False, separators=(",", ":")),
                    "student_profile_json": json.dumps(student_profile, ensure_ascii=False, separators=(",", ":")),
                    "kb_text": "规则候选：" + json.dumps(candidates[:8], ensure_ascii=False),
                }
          appId: 6545ca99
          uid: '21880654528'
          codeErrMsg: ''
