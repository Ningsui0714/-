          - id: c1e14b6b-3564-46d1-bb67-b37858d4b915
            name: context_json
            schema:
              type: string
              value:
                type: ref
                content: {name: context_json, id: 2a903e54-78d3-5940-8d1d-999e969820c3, nodeId: 'ifly-code::f38419ca-55e5-5d56-9176-69457520d034'}
                contentErrMsg: ''
            nameErrMsg: ''
            fileType: ''
        outputs:
          - id: 00cf0bfc-f19b-5f7a-9a86-01169808eca4
            name: final_result_json
            schema: {type: string, default: ''}
            nameErrMsg: ''
            required: false
        nodeParam:
          code: |-
            import json
            import re


            VALID_TYPES = {"remediate", "advance", "practice", "review"}


            def _fallback(candidates, error_message):
                recommendations = []
                for priority, candidate in enumerate(candidates[:3], start=1):
                    recommendations.append({
                        "type": candidate.get("type", "practice"),
                        "knowledge_point_id": candidate.get("knowledge_point_id", ""),
                        "title": candidate.get("title", ""),
                        "reason": candidate.get("evidence", "基于当前学习状态推荐"),
                        "priority": priority,
                    })
                return {
                    "status": "ok" if recommendations else "system_retryable",
                    "recommendations": recommendations,
                    "fallback_used": True,
                    "error_message": error_message[:160],
                }


            def main(model_output, context_json):
                try:
                    context = json.loads(str(context_json or "{}"), strict=False)
                except Exception:
                    context = {}
                candidates = context.get("rule_candidates", []) if isinstance(context, dict) else []
                if not isinstance(candidates, list):
                    candidates = []
                allowed_ids = {
                    str(candidate.get("knowledge_point_id", "")).strip()
                    for candidate in candidates if isinstance(candidate, dict)
                }
                try:
                    text = re.sub(r"^```(?:json)?\s*|\s*```$", "", str(model_output or "").strip(), flags=re.I)
                    start, end = text.find("{"), text.rfind("}")
                    if start < 0 or end < start:
                        raise ValueError("大模型输出中未找到 JSON 对象")
                    result = json.loads(text[start:end + 1], strict=False)
                    items = result.get("recommendations")
                    if not isinstance(items, list):
                        raise ValueError("recommendations 必须是数组")
                    expected_min = min(3, len(allowed_ids))
                    if not (expected_min <= len(items) <= min(5, len(allowed_ids))):
                        raise ValueError("推荐数量与候选数量不匹配")
                    ids = []
                    for priority, item in enumerate(items, start=1):
                        if not isinstance(item, dict):
                            raise ValueError("推荐项必须是对象")
                        item_id = str(item.get("knowledge_point_id", "")).strip()
                        if not item_id or item_id not in allowed_ids:
                            raise ValueError("推荐项不在规则候选中")
                        ids.append(item_id)
                        if item.get("type") not in VALID_TYPES:
                            raise ValueError("推荐类型不在允许枚举中")
                        if not str(item.get("reason", "")).strip():
                            raise ValueError("推荐项缺少 reason")
                        item["priority"] = priority
                    if len(set(ids)) != len(ids):
                        raise ValueError("推荐项不能重复")
                    result["status"] = "ok"
                    result["fallback_used"] = False
                    return {"final_result_json": json.dumps(result, ensure_ascii=False, separators=(",", ":"))}
                except Exception as error:
                    fallback = _fallback(candidates, str(error) or "推荐校验未通过")
                    return {"final_result_json": json.dumps(fallback, ensure_ascii=False, separators=(",", ":"))}
