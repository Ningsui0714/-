    data:
      allowInputReference: true
      allowOutputReference: true
      label: 校验学习讲解输出
      nodeMeta: {aliasName: 代码, nodeType: 工具}
      inputs:
      - id: 3dce7871-67ff-5824-ac0f-5bef1e1950d3
        name: model_output
        schema:
          type: string
          value:
            type: ref
            content: {name: output, id: 4e3bda31-233c-5fb3-b290-580fb9729413,
                nodeId: 'spark-llm::73f515ec-a1ea-5ed1-9766-57c1fe7067e3'}
            contentErrMsg: ''
        nameErrMsg: ''
        fileType: ''
      outputs:
      - id: 45c69638-777a-5669-a828-e79337d97c14
        name: final_result_json
        schema: {type: string, default: ''}
        nameErrMsg: ''
        required: false
      nodeParam:
        code: |-
          import json
          import re


          DELIVERY_MODES = {"first", "resume", "alternative", "example", "steps", "check"}
          NEXT_ACTIONS = {"start_check", "continue_learning"}
          DEPTHS = {"foundational", "guided", "concise"}
          BLOCK_TYPES = {"connection", "concept", "steps", "example", "pitfall", "workplace", "check", "notice"}


          def main(model_output):
              try:
                  text = re.sub(r"^```(?:json)?\s*|\s*```$", "", str(model_output or "").strip(), flags=re.I)
                  start, end = text.find("{"), text.rfind("}")
                  if start < 0 or end < start:
                      raise ValueError("大模型输出中未找到 JSON 对象")
                  result = json.loads(text[start:end + 1], strict=False)
                  if result.get("status") == "needs_clarification":
                      if not str(result.get("clarification_question", "")).strip():
                          raise ValueError("needs_clarification 必须提供 clarification_question")
                      result["workflow_mode"] = "learning"
                      return {"final_result_json": json.dumps(result, ensure_ascii=False, separators=(",", ":"))}
                  if result.get("status") != "ok":
                      raise ValueError("status 必须为 ok")
                  if result.get("delivery_mode") not in DELIVERY_MODES:
                      raise ValueError("delivery_mode 不在允许枚举中")
                  if not str(result.get("lesson_title", "")).strip():
                      raise ValueError("lesson_title 不能为空")
                  teaching_plan = result.get("teaching_plan")
                  if not isinstance(teaching_plan, dict) or not str(teaching_plan.get("primary_mode", "")).strip():
                      raise ValueError("teaching_plan.primary_mode 不能为空")
                  if teaching_plan.get("depth") not in DEPTHS:
                      raise ValueError("teaching_plan.depth 不在允许枚举中")
                  blocks = result.get("content_blocks")
                  if not isinstance(blocks, list) or not blocks:
                      raise ValueError("content_blocks 不能为空")
                  if any(
                      not isinstance(block, dict)
                      or str(block.get("type", "")).strip() not in BLOCK_TYPES
                      or not (
                          str(block.get("content", "")).strip()
                          or (
                              isinstance(block.get("items"), list)
                              and bool(block.get("items"))
                          )
                          or (
                              isinstance(block.get("steps"), list)
                              and bool(block.get("steps"))
                          )
                      )
                      or not str(block.get("source", "")).strip()
                      for block in blocks
                  ):
                      raise ValueError("content_blocks 每个元素必须包含七节模板内的 type、content（或 items/steps 步骤）和非空 source")
                  check = result.get("understanding_check")
                  if not isinstance(check, dict) or not str(check.get("question", "")).strip():
                      raise ValueError("understanding_check.question 不能为空")
                  if result.get("next_action") not in NEXT_ACTIONS:
                      raise ValueError("next_action 不在允许枚举中")
                  result["workflow_mode"] = "learning"
                  return {"final_result_json": json.dumps(result, ensure_ascii=False, separators=(",", ":"))}
              except Exception:
                  fallback = {
                      "status": "system_retryable",
                      "workflow_mode": "learning",
