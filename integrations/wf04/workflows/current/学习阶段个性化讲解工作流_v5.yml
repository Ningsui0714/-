      nodeParam:
        code: "import json\n\n\ndef main(context, kb_text):\n    data = json.loads(str(context
          or \"{}\"), strict=False)\n    if not isinstance(data, dict):\n        raise
          ValueError(\"context 必须是 JSON 对象\")\n    kb = str(kb_text or \"\").strip()\n\
          \    # 后端知识库正文带来源行；弱回退文本带「未提供独立知识库正文」标记。\n    kb_available = bool(kb) and
          \"未提供独立知识库正文\" not in kb\n    target = data.get(\"current_knowledge_point\"\
          ) or data.get(\"learning_target\")\n    if not isinstance(target, dict)
          or not target:\n        target = {}\n    evaluation = data.get(\"validated_evaluation\"\
          )\n    if isinstance(evaluation, dict):\n        errors = evaluation.get(\"\
          error_points\")\n        if isinstance(errors, list) and errors and isinstance(errors[0],
          dict):\n            target = errors[0]\n    parts = [\n        str(target.get(\"\
          knowledge_point_name\") or target.get(\"knowledge_point_id\") or \"\").strip()\n\
          \    ]\n    goal = data.get(\"learning_goal\")\n    if isinstance(goal,
          dict) and str(goal.get(\"goal_name\", \"\")).strip():\n        parts.append(str(goal.get(\"\
          goal_name\")).strip())\n    for key in (\"student_evidence\", \"diagnosis\"\
          , \"root_cause\", \"expected_behavior\", \"error_description\"):\n     \
          \   value = str(target.get(key, \"\")).strip()\n        if value:\n    \
          \        parts.append(value)\n    query = \" \".join(part for part in parts
          if part)\n    if query:\n        query += \" 原理 规范 标准\"\n    return {\"\
          kb_available\": kb_available, \"web_search_query\": query}\n"
