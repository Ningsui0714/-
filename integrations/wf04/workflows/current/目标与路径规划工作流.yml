          value:
            type: ref
            content: {name: context_json, id: 765ab029-d825-5cfa-aeac-70304b43b5a1, nodeId: 'ifly-code::1e16613d-8e31-5491-a6e2-e41ff423715e'}
            contentErrMsg: ''
        nameErrMsg: ''
        fileType: ''
      outputs:
      - id: 9e306771-6f84-5a6c-ae5f-0da12bd7751a
        name: final_result_json
        schema: {type: string, default: ''}
        nameErrMsg: ''
        required: false
      nodeParam:
        code: |-
          import json
          import re


          VALID_GOALS = {"competition", "certification", "daily"}


          def main(model_output, context_json):
              try:
                  text = re.sub(r"^```(?:json)?\s*|\s*```$", "", str(model_output or "").strip(), flags=re.I)
                  start, end = text.find("{"), text.rfind("}")
                  if start < 0 or end < start:
                      raise ValueError("大模型输出中未找到 JSON 对象")
                  result = json.loads(text[start:end + 1], strict=False)
                  context = json.loads(str(context_json or "{}"), strict=False)
                  goal_type = str(result.get("goal_type") or result.get("diagnosis_goal") or "").strip().lower()
                  if goal_type not in VALID_GOALS:
                      raise ValueError("goal_type 不在允许范围")
                  result["goal_type"] = goal_type
                  result["diagnosis_goal"] = goal_type
                  result["confidence"] = max(0.0, min(1.0, float(result.get("confidence", 0.7) or 0.7)))
                  goal = result.get("learning_goal")
                  path = result.get("learning_path")
                  if not isinstance(goal, dict) or not str(goal.get("goal_name", "")).strip():
                      raise ValueError("learning_goal.goal_name 不能为空")
                  if not isinstance(path, dict) or not isinstance(path.get("items"), list):
                      raise ValueError("learning_path.items 必须是数组")
                  items = path["items"]
                  if not (3 <= len(items) <= 10):
                      raise ValueError("路径节点数量必须在 3-10 之间")
                  knowledge_ids = context.get("knowledge_ids", []) if isinstance(context, dict) else []
                  if not isinstance(knowledge_ids, list):
                      knowledge_ids = []
                  ids = [str(item.get("knowledge_point_id", "")).strip() for item in items if isinstance(item, dict)]
                  if len(ids) != len(items) or any(not item_id for item_id in ids):
                      raise ValueError("路径节点缺少 knowledge_point_id")
                  if len(set(ids)) != len(ids):
                      raise ValueError("路径节点不能重复")
                  if knowledge_ids and any(item_id not in knowledge_ids for item_id in ids):
                      raise ValueError("路径节点必须来自可用知识点列表")
                  statuses = [str(item.get("status", "")) for item in items]
                  if any(status not in {"current", "pending", "completed"} for status in statuses):
                      raise ValueError("路径状态不合法")
                  if statuses.count("current") != 1 or statuses[0] != "current":
                      raise ValueError("路径只能有一个首节点为 current")
                  result["status"] = "ok"
                  return {"final_result_json": json.dumps(result, ensure_ascii=False, separators=(",", ":"))}
              except Exception as error:
                  fallback = {
                      "status": "system_retryable",
                      "goal_type": "",
                      "diagnosis_goal": "",
                      "confidence": 0,
                      "learning_path": {"items": []},
                      "error_message": str(error)[:160] or "路径校验未通过，正在重新规划",
                  }
                  return {"final_result_json": json.dumps(fallback, ensure_ascii=False, separators=(",", ":"))}
        appId: 6545ca99
        uid: '21880654528'
        codeErrMsg: ''
