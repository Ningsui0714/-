        name: kb_text
        schema: {type: string, default: ''}
        nameErrMsg: ''
        required: false
      nodeParam:
        code: |-
          import json


          DEFAULT_KNOWLEDGE = [
              {"knowledge_point_id": "KN_JAVA_CLASS", "knowledge_point_name": "类与对象", "prerequisites": []},
              {"knowledge_point_id": "KN_JAVA_ENCAPSULATION", "knowledge_point_name": "封装与访问控制", "prerequisites": ["KN_JAVA_CLASS"]},
              {"knowledge_point_id": "KN_JAVA_INHERITANCE", "knowledge_point_name": "继承", "prerequisites": ["KN_JAVA_ENCAPSULATION"]},
              {"knowledge_point_id": "KN_JAVA_POLYMORPHISM", "knowledge_point_name": "多态", "prerequisites": ["KN_JAVA_INHERITANCE"]},
              {"knowledge_point_id": "KN_JAVA_COLLECTION", "knowledge_point_name": "集合框架", "prerequisites": ["KN_JAVA_CLASS"]},
              {"knowledge_point_id": "KN_JAVA_EXCEPTION", "knowledge_point_name": "异常处理", "prerequisites": ["KN_JAVA_CLASS"]},
              {"knowledge_point_id": "KN_JAVA_IO", "knowledge_point_name": "Java IO", "prerequisites": ["KN_JAVA_EXCEPTION", "KN_JAVA_COLLECTION"]},
          ]


          def _parse_input(raw_input):
              value = raw_input
              for _ in range(3):
                  if isinstance(value, dict):
                      if "input" in value:
                          value = value.get("input")
                          continue
                      if "AGENT_USER_INPUT" in value:
                          value = value.get("AGENT_USER_INPUT")
                          continue
                      return value
                  text = str(value or "").strip()
                  if not text:
                      return {}
                  value = json.loads(text, strict=False)
              if not isinstance(value, dict):
                  raise ValueError("输入必须是 JSON 对象或 JSON 字符串")
              return value


          def main(raw_input):
              data = _parse_input(raw_input)
              if not isinstance(data, dict):
                  raise ValueError("输入必须是 JSON 对象")
              student_id = str(data.get("student_id", "")).strip()
              goal_description = str(data.get("goal_description") or data.get("text") or "").strip()
              if not goal_description:
                  raise ValueError("text 或 goal_description 不能为空")
              knowledge_state = data.get("knowledge_state", {})
              if not isinstance(knowledge_state, dict):
                  knowledge_state = {}
              items = knowledge_state.get("items")
              if not isinstance(items, list):
                  items = knowledge_state.get("learning_path", {}).get("items", [])
              if not isinstance(items, list) or not items:
                  items = DEFAULT_KNOWLEDGE
              knowledge_ids = []
              knowledge_names = {}
              gaps = []
              mastery_by_id = {}
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  item_id = str(item.get("knowledge_point_id", "")).strip()
                  if not item_id:
                      continue
                  knowledge_ids.append(item_id)
                  knowledge_names[item_id] = str(item.get("knowledge_point_name") or item_id)
                  mastery_by_id[item_id] = max(0, min(100, int(item.get("mastery", 0) or 0)))
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  item_id = str(item.get("knowledge_point_id", "")).strip()
                  prereqs = item.get("prerequisites", [])
                  if not isinstance(prereqs, list):
                      prereqs = []
                  missing = []
                  for prereq in prereqs:
                      prereq_id = str(prereq.get("knowledge_point_id", "") if isinstance(prereq, dict) else prereq).strip()
                      if prereq_id and mastery_by_id.get(prereq_id, 0) < 60:
                          missing.append(prereq_id)
                  if missing:
                      gaps.append({"knowledge_point_id": item_id, "missing_prerequisites": missing})
              student_profile = data.get("student_profile") or {}
              if not isinstance(student_profile, dict):
                  student_profile = {}
              context = {
                  "student_id": student_id,
                  "goal_description": goal_description,
                  "knowledge_ids": knowledge_ids,
                  "knowledge_names": knowledge_names,
                  "mastery_by_id": mastery_by_id,
                  "prerequisite_gap": gaps,
              }
              return {
                  "context_json": json.dumps(context, ensure_ascii=False, separators=(",", ":")),
                  "strategy_json": json.dumps({"planning_hint": "先识别目标类型，再补前置缺口并按依赖顺序排路径"}, ensure_ascii=False, separators=(",", ":")),
                  "student_profile_json": json.dumps(student_profile, ensure_ascii=False, separators=(",", ":")),
                  "kb_text": "可用知识点：" + json.dumps(knowledge_names, ensure_ascii=False) + "；前置缺口：" + json.dumps(gaps, ensure_ascii=False),
              }
