                contentErrMsg: ''
            nameErrMsg: ''
            fileType: ''
          - id: '68a25557-8a74-42ef-a948-5c6e44b1e8d8'
            name: knowledge_list
            schema:
              type: string
              value:
                type: ref
                content: {name: knowledge_list, id: 'cb7d60c5-d98a-4c6a-99a3-994208820105', nodeId: 'ifly-code::b007d85b-8c31-4c5a-9e79-07b4789d4bd1'}
                contentErrMsg: ''
            nameErrMsg: ''
            fileType: ''
        outputs:
          - id: 'f071c3ed-6b47-45bc-8744-a4848c65570d'
            name: final_result_json
            schema: {type: string, default: ''}
            nameErrMsg: ''
            required: false
        nodeParam:
          code: |-
            import json
            import re

            VALID_GOALS = {"competition": 8, "certification": 8, "daily": 6}

            def main(model_output, goal, knowledge_list):
                try:
                    parsed_knowledge = json.loads(str(knowledge_list or "[]"), strict=False)
                except Exception:
                    parsed_knowledge = []
                allowed_ids = {
                    str(item.get("knowledge_point_id") or "").strip()
                    for item in parsed_knowledge if isinstance(item, dict)
                }
                text = str(model_output or "").strip()
                text = re.sub(r"^```(?:json)?\s*|\s*```$", "", text, flags=re.I)
                start, end = text.find("{"), text.rfind("}")
                if start < 0 or end < start:
                    raise ValueError("大模型输出中未找到 JSON 对象")
                try:
                    payload = json.loads(text[start:end + 1], strict=False)
                except Exception:
                    payload = {}
                questions = payload.get("questions") or []
                if not isinstance(questions, list):
                    questions = []
                valid = []
                used_question_ids = set()
                for raw in questions:
                    if not isinstance(raw, dict):
                        continue
                    title = str(raw.get("title") or "").strip()
                    options = raw.get("options")
                    answer = str(raw.get("answer") or "").strip().lower()
                    kp_id = str(raw.get("knowledge_point_id") or "").strip()
                    explanation = str(raw.get("explanation") or "").strip()
                    try:
                        difficulty = int(raw.get("difficulty", 1) or 1)
                    except Exception:
                        difficulty = 1
                    if not title or not kp_id:
                        continue
                    if allowed_ids and kp_id not in allowed_ids:
                        continue
                    if not isinstance(options, dict) or len(options) < 3 or answer not in options:
                        continue
                    question_id = str(raw.get("question_id") or "GEN-" + kp_id[-8:]).strip()
                    if not question_id or question_id in used_question_ids:
                        continue
                    used_question_ids.add(question_id)
                    valid.append({
                        "question_id": question_id,
                        "knowledge_point_id": kp_id,
                        "knowledge_point_name": str(raw.get("knowledge_point_name") or kp_id),
                        "title": title,
                        "options": options,
                        "answer": answer,
                        "explanation": explanation or "（未提供解析）",
                        "difficulty": max(1, min(3, difficulty)),
                        "source": "星辰出题工作流（本地校验通过）",
                    })
                valid = valid[:VALID_GOALS.get(str(goal).strip().lower(), 6)]
                output = {
                    "status": "ok",
                    "goal": goal,
                    "questions": valid,
                    "dropped": len(questions) - len(valid),
                    "generated_at": None,
                }
                return {"final_result_json": json.dumps(output, ensure_ascii=False, separators=(",", ":"))}
          appId: 6545ca99
          uid: '21880654528'
          codeErrMsg: ''
        updatable: false
