        nodeParam:
          code: |-
            import json

            def _parse_input(raw_input):
                value = raw_input
                for _ in range(3):
                    if isinstance(value, dict):
                        if "input" in value:
                            value = value.get("input")
                            continue
                        if "AGENT_USER_INPUT" in value:
                            value = value.get("AGENT_USER_INPUT")
                            continue
                        return value
                    text = str(value or "").strip()
                    if not text:
                        return {}
                    value = json.loads(text, strict=False)
                if not isinstance(value, dict):
                    raise ValueError("输入必须是 JSON 对象或 JSON 字符串")
                return value

            def main(raw_input):
                try:
                    data = _parse_input(raw_input)
                    if not isinstance(data, dict):
                        data = {}
                except Exception:
                    data = {}
                goal = str(data.get("goal") or "daily").strip()
                student_id = str(data.get("student_id") or "")
                weak_points = data.get("weak_points") or []
                if not isinstance(weak_points, list):
                    weak_points = []
                knowledge_list = data.get("knowledge_list") or []
                if not isinstance(knowledge_list, list):
                    knowledge_list = []
                if not knowledge_list:
                    knowledge_list = [
                        {"knowledge_point_id": "KN_JAVA_CLASS", "knowledge_point_name": "类与对象"},
                        {"knowledge_point_id": "KN_JAVA_ENCAPSULATION", "knowledge_point_name": "封装与访问控制"},
                        {"knowledge_point_id": "KN_JAVA_INHERITANCE", "knowledge_point_name": "继承"},
                        {"knowledge_point_id": "KN_JAVA_POLYMORPHISM", "knowledge_point_name": "多态"},
                        {"knowledge_point_id": "KN_JAVA_COLLECTION", "knowledge_point_name": "集合框架"},
                        {"knowledge_point_id": "KN_JAVA_EXCEPTION", "knowledge_point_name": "异常处理"},
                        {"knowledge_point_id": "KN_JAVA_IO", "knowledge_point_name": "Java IO"},
                    ]
                return {
                    "goal": goal,
                    "student_id": student_id,
                    "weak_points": json.dumps(weak_points, ensure_ascii=False),
                    "knowledge_list": json.dumps(knowledge_list, ensure_ascii=False),
                }
