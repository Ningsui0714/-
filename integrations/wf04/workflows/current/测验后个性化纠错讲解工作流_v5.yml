      - id: 8b5b51a2-a4f4-5dd0-ae84-6fd1e7f48589
        name: final_result_json
        schema: {type: string, default: ''}
        nameErrMsg: ''
        required: false
      nodeParam:
        code: |-
          import json
          import re


          DELIVERY_MODES = {"first", "resume", "review"}
          NEXT_ACTIONS = {"retry_original", "generate_variant", "continue_learning"}


          def main(model_output):
              try:
                  text = re.sub(r"^```(?:json)?\s*|\s*```$", "", str(model_output or "").strip(), flags=re.I)
                  start, end = text.find("{"), text.rfind("}")
                  if start < 0 or end < start:
                      raise ValueError("大模型输出中未找到 JSON 对象")
                  result = json.loads(text[start:end + 1], strict=False)
                  if result.get("status") != "ok":
                      raise ValueError("status 必须为 ok")
                  if result.get("delivery_mode") not in DELIVERY_MODES:
                      raise ValueError("delivery_mode 不在允许枚举中")
                  steps = result.get("explanation_steps")
                  if not isinstance(steps, list) or len(steps) < 4:
                      raise ValueError("explanation_steps 至少包含四步")
                  if not all(str(step.get("evidence", "")).strip() for step in steps) and not str(result.get("evidence", "")).strip():
                      raise ValueError("explanation_steps 每一步必须带 evidence 或提供整体 evidence")
                  if not str(result.get("personalized_explanation", "")).strip():
                      raise ValueError("personalized_explanation 不能为空")
                  if not str(result.get("retry_guidance", "")).strip():
                      raise ValueError("retry_guidance 不能为空")
                  if result.get("next_action") not in NEXT_ACTIONS:
                      raise ValueError("next_action 不在允许枚举中")
                  result["workflow_mode"] = "remediation"
                  return {"final_result_json": json.dumps(result, ensure_ascii=False, separators=(",", ":"))}
              except Exception:
                  fallback = {
                      "status": "system_retryable",
                      "workflow_mode": "remediation",
                      "delivery_mode": "first",
                      "target_error_summary": "讲解内容重新生成中",
                      "explanation_steps": [
                          {"title": "提示", "content": "系统正在重新生成针对性讲解", "evidence": ""},
                          {"title": "建议", "content": "请稍后重新查看本题讲解", "evidence": ""},
                          {"title": "备选", "content": "你也可以先进入连续学习模式学习相关知识点", "evidence": ""},
                          {"title": "重试", "content": "系统会自动重试，无需额外操作", "evidence": ""},
                      ],
                      "personalized_explanation": "讲解内容正在重新生成，请稍后重试。",
                      "retry_guidance": "请稍后重新查看讲解后再尝试作答。",
                      "variant_practice_request": {
                          "should_generate": False,
                          "trigger": "none",
                          "knowledge_point_id": "",
                          "difficulty": "same",
                          "variation_requirements": [],
                          "avoid_repeating_original": True,
                      },
                      "next_action": "continue_learning",
                      "memory_writeback": {
                          "event_type": "remediation_explanation",
                          "knowledge_point_id": "",
                          "strategy_code": "generation_fallback",
                          "effect": "pending",
                      },
                  }
                  return {"final_result_json": json.dumps(fallback, ensure_ascii=False, separators=(",", ":"))}
        appId: 6545ca99
        uid: '21880654528'
