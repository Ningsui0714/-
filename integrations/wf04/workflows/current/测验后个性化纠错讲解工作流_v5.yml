              {"title":"为什么不对","content":"具体错误证据分析","evidence":"引用 error_points 的 diagnosis/root_cause"},
              {"title":"正确做法","content":"期望行为和最小示例","evidence":"引用 kb_text 来源行"},
              {"title":"检查要点","content":"重做检查清单","evidence":"引用正确要求或 kb_text 来源行"}
            ],
            "personalized_explanation":"完整纠错讲解",
            "retry_guidance":"只包含检查点",
            "variant_practice_request":{"should_generate":true,"trigger":"after_retry_pass|immediate|none","knowledge_point_id":"知识点ID","difficulty":"same|up_one","variation_requirements":["要求1"],"avoid_repeating_original":true},
            "next_action":"retry_original|generate_variant|continue_learning",
            "memory_writeback":{"event_type":"remediation_explanation","knowledge_point_id":"知识点ID","strategy_code":"本轮策略","effect":"pending"}
          }
        appId: 6545ca99
