      nodeParam:
        code: |-
          import json


          def _parse_input(raw_input):
              value = raw_input
              for _ in range(3):
                  if isinstance(value, dict):
                      if "input" in value:
                          value = value.get("input")
                          continue
                      if "AGENT_USER_INPUT" in value:
                          value = value.get("AGENT_USER_INPUT")
                          continue
                      return value
                  text = str(value or "").strip()
                  if not text:
                      return {}
                  value = json.loads(text, strict=False)
              if not isinstance(value, dict):
                  raise ValueError("输入必须是 JSON 对象或 JSON 字符串")
              return value


          def _object(value, name):
              if not isinstance(value, dict) or not value:
                  raise ValueError(name + " 必须是非空对象")
              return value


          def main(raw_input):
              data = _parse_input(raw_input)
              if not isinstance(data, dict):
                  raise ValueError("输入必须是 JSON 对象")
              context = _object(data.get("context"), "context")
              strategy = _object(data.get("strategy"), "strategy")
              profile = _object(data.get("student_profile"), "student_profile")
              kb_text = str(data.get("kb_text", "")).strip()
              if not kb_text:
                  raise ValueError("kb_text 不能为空")
              evaluation = context.get("validated_evaluation", {})
              if not isinstance(evaluation, dict) or not evaluation.get("validation_passed"):
                  raise ValueError("validated_evaluation 必须是已校验评价")
              errors = evaluation.get("error_points")
              if evaluation.get("evaluation_status") != "correct" and (
                  not isinstance(errors, list) or not errors
              ):
                  raise ValueError("非正确评价必须包含 error_points")
              return {
                  "context_json": json.dumps(context, ensure_ascii=False, separators=(",", ":")),
                  "strategy_json": json.dumps(strategy, ensure_ascii=False, separators=(",", ":")),
                  "student_profile_json": json.dumps(profile, ensure_ascii=False, separators=(",", ":")),
                  "kb_text": kb_text,
              }
