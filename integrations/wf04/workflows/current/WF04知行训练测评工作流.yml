                  if question_type == "practical":
                      grading_mode = "exact_text"
              else:
                  options = {}
              answer_schema = {
                  "type": answer_schema_type,
                  "label": _text(schema.get("label") or "请输入你的答案"),
              }
              if question_type in {"choice", "multiple_choice", "judgment"}:
                  answer_schema["options"] = options
              contract = request.get("task_contract") if isinstance(request.get("task_contract"), dict) else {}
              authoritative_rubric = _normalize_rubric(contract.get("rubric"))
              rubric = authoritative_rubric or _normalize_rubric(generated.get("rubric"))
              if not rubric:
                  rubric = [
                      {"criterion_id": "C_CONTENT", "description": "答案满足题目核心要求", "max_points": 70.0, "required": True},
                      {"criterion_id": "C_REASONING", "description": "答案给出可检查的依据或结果", "max_points": 30.0, "required": False},
                  ]
              elif question_type in {"short_answer", "practical"} and len(rubric) < 2:
                  rubric.append({
                      "criterion_id": "C_SUPPORT",
                      "description": "答案给出可检查的依据或结果",
                      "max_points": 1.0,
                      "required": False,
                  })
              requirements = _normalize_requirements(contract.get("hard_required_points"))
              if not requirements:
                  requirements = _normalize_requirements(generated.get("hard_required_points"))
              knowledge_context = request.get("knowledge_context") if isinstance(request.get("knowledge_context"), dict) else {}
              source_refs = [str(item).strip() for item in _list(knowledge_context.get("source_refs")) if str(item).strip()]
              role = _text(request.get("question_role") or "recommended")
              variant_changes = [str(item).strip() for item in _list(generated.get("variant_changes")) if str(item).strip()]
              if role == "variant" and not variant_changes:
                  result = _error(request, "E_VARIANT_NOT_CHANGED", "变式题没有声明实际变化，已阻断入库")
                  return {"result_json": json.dumps(result, ensure_ascii=False)}
              fingerprint = "|".join([
                  _text(request.get("request_id")), kp_id, role, prompt,
              ])
              template_id = "QSPEC-" + hashlib.sha256(fingerprint.encode("utf-8")).hexdigest()[:20].upper()
              rules = contract.get("validation_rules") if isinstance(contract.get("validation_rules"), dict) else {}
              question_spec = {
                  "question_template_id": template_id,
                  "knowledge_point_id": kp_id,
                  "knowledge_point_name": kp_name,
                  "difficulty": _text(request.get("difficulty") or "medium").lower(),
                  "question_role": role,
                  "source_question_instance_id": _text(request.get("source_question_instance_id")),
                  "title": title,
                  "prompt": prompt,
                  "question_type": question_type,
                  "options": options,
                  "answer_schema": answer_schema,
                  "expected_answer": expected,
                  "accepted_answers": accepted_answers,
                  "grading_mode": grading_mode,
                  "reference_answer": reference,
                  "rubric": rubric,
                  "hard_required_points": requirements,
                  "validation_rules": rules,
                  "assessed_concept_ids": [str(item).strip() for item in _list(generated.get("assessed_concept_ids")) if str(item).strip()],
                  "variant_changes": variant_changes,
                  "source_refs": source_refs,
              }
              public_question = {
                  key: value for key, value in question_spec.items()
                  if key not in {
                      "expected_answer",
                      "accepted_answers",
                      "grading_mode",
                      "reference_answer",
                      "rubric",
                      "hard_required_points",
                      "validation_rules",
                  }
              }
              result = {
                  "schema_version": RESULT_SCHEMA,
                  "workflow_mode": "wf04_training_evaluation",
                  "status": "ok",
                  "action": "generate_question",
                  "request_id": _text(request.get("request_id")),
                  "student_id": _text(request.get("student_id")),
                  "project_id": _text(request.get("project_id")),
                  "task_instance_id": _text(request.get("task_instance_id")),
                  "question_spec": question_spec,
                  "public_question": public_question,
                  "id_ownership": "host_backend",
                  "persistence_owner": "zhixing_backend",
                  "host_write_allowed": True,
              }
              return {"result_json": json.dumps(result, ensure_ascii=False)}
