      - id: ef100dec-8075-528e-8972-445bb0916381
        name: result_json
        nameErrMsg: ''
        schema:
          type: string
          default: ''
        required: false
      nodeParam:
        uid: ''
        code: |-
          import json

          RESULT_SCHEMA = "ZHIXING_WF04_RESULT.v1"


          def _object(value):
              if isinstance(value, dict):
                  return value
              try:
                  result = json.loads(str(value or "{}"), strict=False)
              except Exception:
                  result = {}
              return result if isinstance(result, dict) else {}


          def _number(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return float(default)


          def _text(value):
              return str(value or "").strip()


          def main(request_json):
              request = _object(request_json)
              summary = request.get("evidence_summary") if isinstance(request.get("evidence_summary"), dict) else {}
              knowledge = request.get("knowledge_point") if isinstance(request.get("knowledge_point"), dict) else {}
              mastery = max(0.0, min(1.0, _number(summary.get("mastery"))))
              confidence = max(0.0, min(1.0, _number(summary.get("confidence"))))
              independent_count = max(0, int(_number(summary.get("independent_evidence_count"))))
              minimum = max(1, int(_number(summary.get("minimum_independent_evidence"), 2)))
              recent = summary.get("recent_attempts") if isinstance(summary.get("recent_attempts"), list) else []
              consecutive_wrong = 0
              for item in reversed(recent):
                  if not isinstance(item, dict):
                      continue
                  if _text(item.get("evaluation_status")) == "incorrect":
                      consecutive_wrong += 1
                  else:
                      break
              mastery_threshold = max(0.0, min(1.0, _number(summary.get("mastery_threshold"), 0.8)))
              confidence_threshold = max(0.0, min(1.0, _number(summary.get("confidence_threshold"), 0.4)))
              if consecutive_wrong >= 2:
                  action = "learn_knowledge"
                  difficulty = "down_one"
                  level = "intensive"
                  reason = "最近连续作答困难，建议先回学当前知识点，再由学生决定是否继续。"
              elif mastery >= mastery_threshold and confidence >= confidence_threshold and independent_count >= minimum:
                  action = "switch_knowledge_or_challenge"
                  difficulty = "up_one"
                  level = "normal"
                  reason = "掌握度、可信度和独立证据均达到当前规则，可以挑战或切换知识点。"
              elif independent_count < minimum:
                  action = "continue_practice"
                  difficulty = "same"
                  level = "normal"
                  reason = "独立证据尚未达到最低数量，建议继续练习，但不强制。"
              elif mastery < mastery_threshold:
                  action = "generate_variant"
                  difficulty = "same"
                  level = "guided"
                  reason = "已有证据但掌握度未达阈值，建议用变式题验证迁移。"
              else:
                  action = "continue_practice"
                  difficulty = "same"
                  level = "normal"
                  reason = "当前证据没有触发强干预，保持难度继续练习。"
              result = {
                  "schema_version": RESULT_SCHEMA,
                  "workflow_mode": "wf04_training_evaluation",
                  "status": "ok",
                  "action": "recommend_next_practice",
                  "request_id": _text(request.get("request_id")),
                  "student_id": _text(request.get("student_id")),
                  "project_id": _text(request.get("project_id")),
                  "task_instance_id": _text(request.get("task_instance_id")),
                  "knowledge_point_id": _text(knowledge.get("knowledge_point_id")),
                  "adaptive_policy": {
                      "recommended_action": action,
                      "recommended_difficulty": difficulty,
                      "intervention_level": level,
                      "reason": reason,
                      "advisory_only": True,
                      "student_may_exit_or_choose_other_action": True,
                  },
                  "rule_check": {
                      "mastery_threshold_met": mastery >= mastery_threshold,
                      "confidence_threshold_met": confidence >= confidence_threshold,
                      "minimum_independent_evidence_met": independent_count >= minimum,
                      "consecutive_wrong_count": consecutive_wrong,
                  },
                  "state_write_policy": "host_backend_only",
                  "persistence_owner": "zhixing_backend",
                  "host_write_allowed": True,
              }
              return {"result_json": json.dumps(result, ensure_ascii=False)}
        appId: ''
        codeErrMsg: ''
