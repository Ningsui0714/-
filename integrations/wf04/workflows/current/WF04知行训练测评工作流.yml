                  return {"result_json": json.dumps(result, ensure_ascii=False)}
              schema = generated.get("answer_schema") if isinstance(generated.get("answer_schema"), dict) else {}
              raw_options = generated.get("options")
              if not isinstance(raw_options, dict):
                  raw_options = schema.get("options") if isinstance(schema.get("options"), dict) else {}
              options = {
                  _text(key).lower(): _text(value)
