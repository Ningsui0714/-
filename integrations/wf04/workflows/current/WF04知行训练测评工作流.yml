          type: string
          default: ''
        required: false
      nodeParam:
        uid: ''
        code: |-
          import json

          REQUEST_SCHEMA = "ZHIXING_WF04_REQUEST.v1"
          RESULT_SCHEMA = "ZHIXING_WF04_RESULT.v1"
          SUPPORTED_ACTIONS = {
              "generate_question",
              "evaluate_answer",
              "recommend_next_practice",
          }
          QUESTION_TYPES = {
              "choice",
              "multiple_choice",
              "judgment",
              "fill_blank",
              "short_answer",
              "practical",
          }


          def _parse_object(value):
              current = value
              for _ in range(4):
                  if isinstance(current, dict):
                      if "AGENT_USER_INPUT" in current and len(current) <= 3:
                          current = current.get("AGENT_USER_INPUT")
                          continue
                      if "input" in current and len(current) <= 3:
                          current = current.get("input")
                          continue
                      return current
                  text = str(current or "").strip()
                  if not text:
                      return {}
                  current = json.loads(text, strict=False)
              return current if isinstance(current, dict) else {}


          def _error(code, message, data=None):
              data = data if isinstance(data, dict) else {}
              return {
                  "schema_version": RESULT_SCHEMA,
                  "workflow_mode": "wf04_training_evaluation",
                  "status": "error",
                  "action": str(data.get("action") or ""),
                  "request_id": str(data.get("request_id") or ""),
                  "student_id": str(data.get("student_id") or ""),
                  "error": {"code": code, "message": message},
                  "host_write_allowed": False,
              }


          def _text(value):
              return str(value or "").strip()


          def _validate_common(data):
              errors = []
              if _text(data.get("schema_version")) != REQUEST_SCHEMA:
                  errors.append("schema_version 必须为 " + REQUEST_SCHEMA)
              if _text(data.get("action")) not in SUPPORTED_ACTIONS:
                  errors.append("action 不受支持")
              for field in ("request_id", "student_id", "project_id", "task_instance_id"):
                  if not _text(data.get(field)):
                      errors.append(field + " 不能为空")
              return errors


          def _validate_generate(data):
              errors = []
              knowledge = data.get("knowledge_point")
              if not isinstance(knowledge, dict):
                  return ["knowledge_point 必须是对象"]
              if not _text(knowledge.get("knowledge_point_id")):
                  errors.append("knowledge_point.knowledge_point_id 不能为空")
              if not _text(knowledge.get("knowledge_point_name")):
                  errors.append("knowledge_point.knowledge_point_name 不能为空")
              difficulty = _text(data.get("difficulty") or "medium").lower()
              if difficulty not in {"easy", "medium", "hard", "challenge"}:
                  errors.append("difficulty 必须为 easy、medium、hard 或 challenge")
              requested_question_type = _text(
                  data.get("requested_question_type") or "short_answer"
              ).lower()
              if requested_question_type not in QUESTION_TYPES:
                  errors.append(
                      "requested_question_type 必须为 choice、multiple_choice、judgment、"
                      "fill_blank、short_answer 或 practical"
                  )
              else:
                  # 缺省请求按简答题处理，确保旧调用仍可得到稳定、可校验的结果。
                  data["requested_question_type"] = requested_question_type
              role = _text(data.get("question_role") or "recommended")
              if role not in {"recommended", "retry_original", "variant", "challenge", "direct_validation"}:
                  errors.append("question_role 不受支持")
              if role == "variant" and not _text(data.get("source_question_instance_id")):
                  errors.append("生成变式题时 source_question_instance_id 不能为空")
              contract = data.get("task_contract")
              if not isinstance(contract, dict):
                  errors.append("task_contract 必须是对象")
                  contract = {}
              assessment_mode = _text(contract.get("assessment_mode") or "practice")
              if assessment_mode not in {"formal", "practice", "provisional"}:
                  errors.append("task_contract.assessment_mode 不受支持")
              if assessment_mode == "formal":
                  if not isinstance(contract.get("rubric"), list) or not contract.get("rubric"):
                      errors.append("正式评价必须提供非空 rubric")
                  rules = contract.get("validation_rules")
                  if not isinstance(rules, dict):
                      errors.append("正式评价必须提供 validation_rules")
              context = data.get("knowledge_context")
              if not isinstance(context, dict):
                  errors.append("knowledge_context 必须是对象")
              elif assessment_mode == "formal" and (
                  not isinstance(context.get("source_refs"), list) or not context.get("source_refs")
              ):
                  errors.append("正式出题必须提供非空 knowledge_context.source_refs")
              return errors


          def _validate_evaluate(data):
              errors = []
              for field in ("question_instance_id", "attempt_id"):
                  if not _text(data.get(field)):
                      errors.append(field + " 不能为空")
              question = data.get("question_snapshot")
              if not isinstance(question, dict):
                  return errors + ["question_snapshot 必须是对象"]
              for field in ("knowledge_point_id", "prompt"):
                  if not _text(question.get(field)):
                      errors.append("question_snapshot." + field + " 不能为空")
              attempt = data.get("current_attempt")
              if not isinstance(attempt, dict):
                  errors.append("current_attempt 必须是对象")
              elif not _text(attempt.get("student_answer")):
                  errors.append("current_attempt.student_answer 不能为空")
              contract = data.get("task_contract")
              if contract is not None and not isinstance(contract, dict):
                  errors.append("task_contract 必须是对象")
              return errors


          def _validate_policy(data):
              errors = []
              knowledge = data.get("knowledge_point")
              if not isinstance(knowledge, dict) or not _text(knowledge.get("knowledge_point_id")):
                  errors.append("knowledge_point.knowledge_point_id 不能为空")
              summary = data.get("evidence_summary")
              if not isinstance(summary, dict):
                  errors.append("evidence_summary 必须是对象")
              return errors


          def main(AGENT_USER_INPUT):
              try:
                  data = _parse_object(AGENT_USER_INPUT)
              except Exception:
                  result = _error("E_INPUT_NOT_JSON", "AGENT_USER_INPUT 必须是合法 JSON 对象")
                  return {
                      "route": "invalid",
                      "request_json": "{}",
                      "prompt_json": "{}",
                      "error_result_json": json.dumps(result, ensure_ascii=False),
                  }
              if not isinstance(data, dict):
                  data = {}
              errors = _validate_common(data)
              action = _text(data.get("action"))
              if not errors and action == "generate_question":
                  errors.extend(_validate_generate(data))
              elif not errors and action == "evaluate_answer":
                  errors.extend(_validate_evaluate(data))
              elif not errors and action == "recommend_next_practice":
                  errors.extend(_validate_policy(data))
              if errors:
                  result = _error("E_REQUEST_VALIDATION", "；".join(errors), data)
                  route = "invalid"
              else:
                  result = {}
                  route = action
              prompt = {
                  "request": data,
                  "contract": {
                      "request_schema": REQUEST_SCHEMA,
                      "result_schema": RESULT_SCHEMA,
                      "host_system_is_source_of_truth": True,
                      "workflow_must_not_write_mastery_or_database": True,
                  },
              }
              return {
                  "route": route,
                  "request_json": json.dumps(data, ensure_ascii=False),
                  "prompt_json": json.dumps(prompt, ensure_ascii=False),
                  "error_result_json": json.dumps(result, ensure_ascii=False),
              }
        appId: ''
        codeErrMsg: ''
