        code: |-
          import hashlib
          import json
          import re

          RESULT_SCHEMA = "ZHIXING_WF04_RESULT.v1"
          QUESTION_TYPES = {
              "choice",
              "multiple_choice",
              "judgment",
              "fill_blank",
              "short_answer",
              "practical",
          }


          def _object(value):
              def decode(candidate, depth=0):
                  if depth > 5:
                      return {}
                  if isinstance(candidate, dict):
                      expected_keys = {
                          "title", "prompt", "question_type", "criterion_results",
                          "schema_version", "request_id", "action",
                      }
                      if expected_keys.intersection(candidate):
                          return candidate
                      for key in ("content", "output", "result", "data", "text", "answer"):
                          if key in candidate:
                              nested = decode(candidate.get(key), depth + 1)
                              if nested:
                                  return nested
                      return candidate
                  if isinstance(candidate, list) and len(candidate) == 1:
                      return decode(candidate[0], depth + 1)
                  text = str(candidate or "").lstrip("\ufeff").strip()
                  if not text:
                      return {}
                  try:
                      parsed = json.loads(text, strict=False)
                  except Exception:
                      parsed = None
                  if parsed is not None:
                      nested = decode(parsed, depth + 1)
                      if nested:
                          return nested
                  fenced = re.findall(r"```(?:json)?\s*([\s\S]*?)```", text, flags=re.I)
                  for block in fenced:
                      nested = decode(block, depth + 1)
                      if nested:
                          return nested
                  in_string = False
                  escaped = False
                  level = 0
                  start = -1
                  for index, char in enumerate(text):
                      if in_string:
                          if escaped:
                              escaped = False
                          elif char == "\\":
                              escaped = True
                          elif char == '"':
                              in_string = False
                          continue
                      if char == '"':
                          in_string = True
                      elif char == "{":
                          if level == 0:
                              start = index
                          level += 1
                      elif char == "}" and level:
                          level -= 1
                          if level == 0 and start >= 0:
                              try:
                                  parsed = json.loads(text[start:index + 1], strict=False)
                              except Exception:
                                  parsed = None
                              if parsed is not None:
                                  nested = decode(parsed, depth + 1)
                                  if nested:
                                      return nested
                              start = -1
                  return {}

              return decode(value)


          def _output_diagnostic(value):
              text = str(value or "")
              digest = hashlib.sha256(text.encode("utf-8", errors="replace")).hexdigest()[:12]
              return "输出类型=" + type(value).__name__ + "，字符数=" + str(len(text)) + "，摘要=" + digest


          def _text(value):
              return str(value or "").strip()


          def _list(value):
              return value if isinstance(value, list) else []


          def _normalize_rubric(items):
              result = []
              for index, raw in enumerate(_list(items), start=1):
                  if not isinstance(raw, dict):
                      continue
                  description = _text(raw.get("description") or raw.get("criterion"))
                  if not description:
                      continue
                  try:
                      points = float(raw.get("max_points", raw.get("points", 0)) or 0)
                  except Exception:
                      points = 0
                  if points <= 0:
                      continue
                  result.append({
                      "criterion_id": _text(raw.get("criterion_id") or "C" + str(index)),
                      "description": description,
                      "max_points": points,
                      "required": bool(raw.get("required", False)),
                  })
              return result


          def _normalize_requirements(items):
              result = []
              for index, raw in enumerate(_list(items), start=1):
                  if isinstance(raw, str):
                      description = raw.strip()
                      requirement_id = "R" + str(index)
                  elif isinstance(raw, dict):
                      description = _text(raw.get("description") or raw.get("requirement"))
                      requirement_id = _text(raw.get("requirement_id") or "R" + str(index))
                  else:
                      continue
                  if description:
                      result.append({"requirement_id": requirement_id, "description": description})
              return result


          def _error(request, code, message):
              return {
                  "schema_version": RESULT_SCHEMA,
                  "workflow_mode": "wf04_training_evaluation",
                  "status": "error",
                  "action": "generate_question",
                  "request_id": _text(request.get("request_id")),
                  "student_id": _text(request.get("student_id")),
                  "error": {
                      "code": code,
                      "message": message,
                      "retryable": code in {
                          "E_MODEL_OUTPUT_INVALID",
                          "E_MODEL_QUESTION_TYPE_INVALID",
                          "E_QUESTION_TYPE_MISMATCH",
                          "E_QUESTION_INCOMPLETE",
                      },
                  },
                  "host_write_allowed": False,
              }


          def main(model_output, request_json):
              request = _object(request_json)
              generated = _object(model_output)
              if not generated:
                  message = "出题模型未返回可恢复的 JSON 对象；" + _output_diagnostic(model_output)
                  return {"result_json": json.dumps(_error(request, "E_MODEL_OUTPUT_INVALID", message), ensure_ascii=False)}
              knowledge = request.get("knowledge_point") if isinstance(request.get("knowledge_point"), dict) else {}
              kp_id = _text(knowledge.get("knowledge_point_id"))
              kp_name = _text(knowledge.get("knowledge_point_name"))
              title = _text(generated.get("title"))
              prompt = _text(generated.get("prompt"))
              requested_question_type = _text(
                  request.get("requested_question_type") or "short_answer"
              ).lower()
              generated_question_type = _text(generated.get("question_type")).lower()
              if requested_question_type not in QUESTION_TYPES:
                  return {"result_json": json.dumps(_error(
                      request,
                      "E_REQUESTED_QUESTION_TYPE_INVALID",
                      "requested_question_type 不受支持",
                  ), ensure_ascii=False)}
              if generated_question_type not in QUESTION_TYPES:
                  return {"result_json": json.dumps(_error(
                      request,
                      "E_MODEL_QUESTION_TYPE_INVALID",
                      "出题模型返回了协议未定义的 question_type",
                  ), ensure_ascii=False)}
              if generated_question_type != requested_question_type:
                  return {"result_json": json.dumps(_error(
                      request,
                      "E_QUESTION_TYPE_MISMATCH",
                      "出题模型返回的 question_type 与 requested_question_type 不一致",
                  ), ensure_ascii=False)}
              question_type = requested_question_type
              raw_expected = generated.get("expected_answer")
              if isinstance(raw_expected, (list, tuple)):
                  raw_expected = ",".join(
                      _text(item) for item in raw_expected if _text(item)
                  )
              expected = _text(raw_expected)
              reference = _text(generated.get("reference_answer"))
              if not title or not prompt or not expected or not reference:
                  result = _error(request, "E_QUESTION_INCOMPLETE", "题目缺少 title、prompt、expected_answer 或 reference_answer")
                  return {"result_json": json.dumps(result, ensure_ascii=False)}
              if len(expected) >= 6 and expected in prompt:
