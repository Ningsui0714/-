        code: |-
          import hashlib
          import json
          import re

          RESULT_SCHEMA = "ZHIXING_WF04_RESULT.v1"


          def _object(value):
              def decode(candidate, depth=0):
                  if depth > 5:
                      return {}
                  if isinstance(candidate, dict):
                      expected_keys = {
                          "title", "prompt", "question_type", "criterion_results",
                          "schema_version", "request_id", "action",
                      }
                      if expected_keys.intersection(candidate):
                          return candidate
                      for key in ("content", "output", "result", "data", "text", "answer"):
                          if key in candidate:
                              nested = decode(candidate.get(key), depth + 1)
                              if nested:
                                  return nested
                      return candidate
                  if isinstance(candidate, list) and len(candidate) == 1:
                      return decode(candidate[0], depth + 1)
                  text = str(candidate or "").lstrip("\ufeff").strip()
                  if not text:
                      return {}
                  try:
                      parsed = json.loads(text, strict=False)
                  except Exception:
                      parsed = None
                  if parsed is not None:
                      nested = decode(parsed, depth + 1)
                      if nested:
                          return nested
                  fenced = re.findall(r"```(?:json)?\s*([\s\S]*?)```", text, flags=re.I)
                  for block in fenced:
                      nested = decode(block, depth + 1)
                      if nested:
                          return nested
                  in_string = False
                  escaped = False
                  level = 0
                  start = -1
                  for index, char in enumerate(text):
                      if in_string:
                          if escaped:
                              escaped = False
                          elif char == "\\":
                              escaped = True
                          elif char == '"':
                              in_string = False
                          continue
                      if char == '"':
                          in_string = True
                      elif char == "{":
                          if level == 0:
                              start = index
                          level += 1
                      elif char == "}" and level:
                          level -= 1
                          if level == 0 and start >= 0:
                              try:
                                  parsed = json.loads(text[start:index + 1], strict=False)
                              except Exception:
                                  parsed = None
                              if parsed is not None:
                                  nested = decode(parsed, depth + 1)
                                  if nested:
                                      return nested
                              start = -1
                  return {}

              return decode(value)


          def _output_diagnostic(value):
              text = str(value or "")
              digest = hashlib.sha256(text.encode("utf-8", errors="replace")).hexdigest()[:12]
              return "输出类型=" + type(value).__name__ + "，字符数=" + str(len(text)) + "，摘要=" + digest


          def _text(value):
              return str(value or "").strip()


          def _list(value):
              return value if isinstance(value, list) else []


          def _number(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return float(default)


          def _clamp(value, low=0.0, high=100.0):
              return max(low, min(high, _number(value)))


          def _criterion_id(raw, index):
              if not isinstance(raw, dict):
                  return "C" + str(index)
              return _text(raw.get("criterion_id") or "C" + str(index))


          def _requirement_id(raw, index):
              if isinstance(raw, str):
                  return "R" + str(index)
              if not isinstance(raw, dict):
                  return "R" + str(index)
              return _text(raw.get("requirement_id") or "R" + str(index))


          def _error(request, code, message):
              return {
                  "schema_version": RESULT_SCHEMA,
                  "workflow_mode": "wf04_training_evaluation",
                  "status": "error",
                  "action": "evaluate_answer",
                  "request_id": _text(request.get("request_id")),
                  "student_id": _text(request.get("student_id")),
                  "question_instance_id": _text(request.get("question_instance_id")),
                  "attempt_id": _text(request.get("attempt_id")),
                  "error": {
                      "code": code,
                      "message": message,
                      "retryable": code == "E_MODEL_OUTPUT_INVALID",
                  },
                  "host_write_allowed": False,
              }


          def main(model_output, request_json):
              request = _object(request_json)
              analysis = _object(model_output)
              if not analysis:
                  message = "评价模型未返回可恢复的 JSON 对象；" + _output_diagnostic(model_output)
                  result = _error(request, "E_MODEL_OUTPUT_INVALID", message)
                  return {"result_json": json.dumps(result, ensure_ascii=False)}
              question = request.get("question_snapshot") if isinstance(request.get("question_snapshot"), dict) else {}
              attempt = request.get("current_attempt") if isinstance(request.get("current_attempt"), dict) else {}
              contract = request.get("task_contract") if isinstance(request.get("task_contract"), dict) else {}
              rubric = question.get("rubric") if isinstance(question.get("rubric"), list) else contract.get("rubric")
              rubric = rubric if isinstance(rubric, list) else []
              criterion_outputs = analysis.get("criterion_results") if isinstance(analysis.get("criterion_results"), list) else []
              criterion_map = {
                  _text(item.get("criterion_id")): item
                  for item in criterion_outputs if isinstance(item, dict) and _text(item.get("criterion_id"))
              }
              normalized_criteria = []
              total_points = 0.0
              awarded_points = 0.0
              required_criteria_met = True
              for index, raw in enumerate(rubric, start=1):
                  if not isinstance(raw, dict):
                      continue
                  cid = _criterion_id(raw, index)
                  maximum = max(0.0, _number(raw.get("max_points", raw.get("points", 0))))
                  if maximum <= 0:
                      continue
                  model_item = criterion_map.get(cid, {})
                  awarded = _clamp(model_item.get("awarded_points", 0), 0.0, maximum)
                  met = bool(model_item.get("met", False))
                  if bool(raw.get("required", False)) and not met:
                      required_criteria_met = False
                  total_points += maximum
                  awarded_points += awarded
                  normalized_criteria.append({
                      "criterion_id": cid,
                      "description": _text(raw.get("description") or raw.get("criterion")),
                      "max_points": maximum,
                      "awarded_points": awarded,
                      "met": met,
                      "required": bool(raw.get("required", False)),
                      "evidence": _text(model_item.get("evidence")),
                  })
              if total_points <= 0:
                  result = _error(request, "E_RUBRIC_MISSING", "评价缺少可计算的 rubric，已阻断正式写入")
                  return {"result_json": json.dumps(result, ensure_ascii=False)}
              score = round(awarded_points / total_points * 100.0, 1)
              requirements = question.get("hard_required_points")
              if not isinstance(requirements, list):
                  requirements = contract.get("hard_required_points")
              requirements = requirements if isinstance(requirements, list) else []
              requirement_outputs = analysis.get("hard_requirement_results") if isinstance(analysis.get("hard_requirement_results"), list) else []
              requirement_map = {
                  _text(item.get("requirement_id")): item
                  for item in requirement_outputs if isinstance(item, dict) and _text(item.get("requirement_id"))
              }
              normalized_requirements = []
              hard_met = required_criteria_met
              for index, raw in enumerate(requirements, start=1):
                  rid = _requirement_id(raw, index)
                  description = _text(raw if isinstance(raw, str) else raw.get("description"))
                  model_item = requirement_map.get(rid, {})
                  met = bool(model_item.get("met", False))
                  hard_met = hard_met and met
                  normalized_requirements.append({
                      "requirement_id": rid,
                      "description": description,
                      "met": met,
                      "evidence": _text(model_item.get("evidence")),
                  })
              rules = question.get("validation_rules") if isinstance(question.get("validation_rules"), dict) else contract.get("validation_rules")
              rules = rules if isinstance(rules, dict) else {}
              pass_score = _clamp(rules.get("pass_score", 80), 0.0, 100.0)
              is_correct = score >= pass_score and hard_met
              hint_used = bool(attempt.get("hint_used", False))
              solution_revealed = bool(attempt.get("solution_revealed", False))
              independent = not hint_used and not solution_revealed
              confidence = max(0.0, min(1.0, _number(analysis.get("confidence"), 0.5)))
              knowledge_id = _text(question.get("knowledge_point_id"))
              knowledge_name = _text(question.get("knowledge_point_name") or knowledge_id)
              errors = []
              for index, raw in enumerate(_list(analysis.get("error_points")), start=1):
                  if not isinstance(raw, dict):
                      continue
                  severity = _text(raw.get("severity") or "medium").lower()
                  if severity not in {"low", "medium", "high"}:
                      severity = "medium"
                  errors.append({
                      "error_id": _text(raw.get("error_id") or "ERR" + str(index)),
                      "knowledge_point_id": knowledge_id,
                      "knowledge_point_name": knowledge_name,
                      "error_type": _text(raw.get("error_type") or "conceptual"),
                      "student_evidence": _text(raw.get("student_evidence")),
                      "expected_behavior": _text(raw.get("expected_behavior")),
                      "root_cause": _text(raw.get("root_cause")),
                      "severity": severity,
                      "confidence": max(0.0, min(1.0, _number(raw.get("confidence"), confidence))),
                  })
              if is_correct:
                  errors = []
              elif not errors:
                  errors = [{
                      "error_id": "EVIDENCE_INSUFFICIENT",
                      "knowledge_point_id": knowledge_id,
                      "knowledge_point_name": knowledge_name,
                      "error_type": "expression",
                      "student_evidence": _text(attempt.get("student_answer")),
                      "expected_behavior": "按照 rubric 与硬性要求给出完整、可验证的答案",
                      "root_cause": "当前答案未提供足够证据满足评分标准",
                      "severity": "medium",
                      "confidence": confidence,
                  }]
              identity = "|".join([
                  _text(request.get("request_id")),
                  _text(request.get("question_instance_id")),
                  _text(request.get("attempt_id")),
              ])
              digest = hashlib.sha256(identity.encode("utf-8")).hexdigest()[:24]
              evaluation_id = "EVAL-" + digest.upper()
              event_id = "EVID-" + digest.upper()
              wrongbook_event_id = "WB-" + digest.upper()
              question_instance_id = _text(request.get("question_instance_id"))
              source_question_instance_id = _text(
                  question.get("source_question_instance_id") or question.get("source_question_id")
              )
              root_question_instance_id = _text(
                  question.get("root_question_instance_id")
                  or source_question_instance_id
                  or question_instance_id
              )
              if is_correct and independent:
                  evidence_type = "independent_correct"
                  next_action = "generate_variant"
                  recommended_difficulty = "same"
                  intervention = "normal"
                  wrongbook_event_type = "independent_correct_recorded"
                  wrongbook_projection_instruction = "mark_improved_not_deleted_if_prior_wrong"
                  wrongbook_proposed_status = "improved_not_deleted_if_prior_wrong"
              elif is_correct:
                  evidence_type = "assisted_correct"
                  next_action = "direct_validation"
                  recommended_difficulty = "same"
                  intervention = "guided"
                  wrongbook_event_type = "assisted_correct_recorded"
                  wrongbook_projection_instruction = "retain_needs_review_if_prior_wrong"
                  wrongbook_proposed_status = "needs_review_if_prior_wrong"
              elif score < 50:
                  evidence_type = "incorrect"
                  next_action = "learn_knowledge"
                  recommended_difficulty = "down_one"
                  intervention = "intensive"
                  wrongbook_event_type = "wrong_attempt_recorded"
                  wrongbook_projection_instruction = "upsert_needs_review"
                  wrongbook_proposed_status = "needs_review"
              else:
                  evidence_type = "incorrect"
                  next_action = "retry_original"
                  recommended_difficulty = "same"
                  intervention = "guided"
                  wrongbook_event_type = "wrong_attempt_recorded"
                  wrongbook_projection_instruction = "upsert_needs_review"
                  wrongbook_proposed_status = "needs_review"
              validated = {
                  "validation_passed": True,
                  "evaluation_id": evaluation_id,
                  "evaluation_status": "correct" if is_correct else "incorrect",
                  "score": score,
                  "max_score": 100,
                  "pass_score": pass_score,
                  "hard_requirements_met": hard_met,
                  "independent_evidence": independent,
                  "criterion_results": normalized_criteria,
                  "hard_requirement_results": normalized_requirements,
                  "error_points": errors,
                  "summary": _text(analysis.get("summary")),
                  "confidence": confidence,
              }
              result = {
                  "schema_version": RESULT_SCHEMA,
                  "workflow_mode": "wf04_training_evaluation",
                  "status": "ok",
                  "action": "evaluate_answer",
                  "request_id": _text(request.get("request_id")),
                  "student_id": _text(request.get("student_id")),
                  "project_id": _text(request.get("project_id")),
                  "task_instance_id": _text(request.get("task_instance_id")),
                  "question_instance_id": question_instance_id,
                  "attempt_id": _text(request.get("attempt_id")),
                  "evaluation_id": evaluation_id,
                  "correct": is_correct,
                  "validated_evaluation": validated,
                  "adaptive_policy": {
                      "recommended_action": next_action,
                      "recommended_difficulty": recommended_difficulty,
                      "intervention_level": intervention,
                      "advisory_only": True,
                  },
                  "evidence_event": {
                      "event_id": event_id,
                      "event_type": evidence_type,
                      "knowledge_point_id": knowledge_id,
                      "score": score,
                      "confidence": confidence,
                      "question_instance_id": question_instance_id,
                      "attempt_id": _text(request.get("attempt_id")),
                      "evaluation_id": evaluation_id,
                  },
                  "wrongbook_event": {
                      "event_id": wrongbook_event_id,
                      "event_type": wrongbook_event_type,
                      "projection_instruction": wrongbook_projection_instruction,
                      "proposed_status": wrongbook_proposed_status,
                      "student_id": _text(request.get("student_id")),
                      "project_id": _text(request.get("project_id")),
                      "task_instance_id": _text(request.get("task_instance_id")),
                      "knowledge_point_id": knowledge_id,
                      "question_instance_id": question_instance_id,
                      "source_question_instance_id": source_question_instance_id,
                      "root_question_instance_id": root_question_instance_id,
                      "question_role": _text(question.get("question_role") or "recommended"),
                      "attempt_id": _text(request.get("attempt_id")),
                      "evaluation_id": evaluation_id,
                      "independent_evidence": independent,
                      "current_unresolved_error_points": errors if not is_correct else [],
                      "history_retention_policy": "never_delete_failed_attempts",
                  },
                  "wrongbook_projection_owner": "zhixing_backend",
                  "state_write_policy": "host_backend_only",
                  "persistence_owner": "zhixing_backend",
                  "host_write_allowed": True,
              }
              return {"result_json": json.dumps(result, ensure_ascii=False)}
