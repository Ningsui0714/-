            content:
              name: context_json
              id: 54870d03-0b71-5190-81cf-f6ac05969f9f
              nodeId: ifly-code::0802a666-df88-52ec-84a5-6fe5399fd0b9
            contentErrMsg: ''
        fileType: ''
      outputs:
      - id: 45c69638-777a-5669-a828-e79337d97c14
        name: final_result_json
        nameErrMsg: ''
        schema:
          type: string
          default: ''
        required: false
      nodeParam:
        uid: '21880654528'
        code: |-
          import json
          import re


          DELIVERY_MODES = {
              "first",
              "resume",
              "alternative",
              "example",
              "steps",
              "check",
          }

          NEXT_ACTIONS = {
              "start_check",
              "continue_learning",
          }

          DEPTHS = {
              "foundational",
              "guided",
              "concise",
          }

          BLOCK_TYPES = {
              "connection",
              "concept",
              "steps",
              "example",
              "code",
              "formula",
              "diagram",
              "comparison",
              "pitfall",
              "warning",
              "workplace",
              "standard",
              "safety",
              "check",
              "notice",
          }


          FORBIDDEN_SOURCE_PREFIXES = (
              "context.",
              "student_profile",
              "strategy",
              "系统提示",
              "模型生成",
              "学习目标",
              "初次测评结果",
          )


          def _parse_json(value, field_name):
              if isinstance(value, dict):
                  return value

              text = str(value or "").strip()

              if not text:
                  raise ValueError(f"{field_name} 不能为空")

              try:
                  return json.loads(text, strict=False)
              except Exception as exc:
                  raise ValueError(f"{field_name} 不是合法 JSON") from exc


          def _clean_model_json(model_output):
              text = str(model_output or "").strip()

              text = re.sub(
                  r"^```(?:json)?\s*|\s*```$",
                  "",
                  text,
                  flags=re.IGNORECASE,
              ).strip()

              start = text.find("{")
              end = text.rfind("}")

              if start < 0 or end < start:
                  raise ValueError("大模型输出中未找到 JSON 对象")

              return json.loads(text[start:end + 1], strict=False)


          def _normalise_source(value):
              return re.sub(r"\s+", " ", str(value or "").strip()).lower()


          def _extract_evidence_candidates(context):
              evidence_pack = context.get("web_evidence_pack")

              if not isinstance(evidence_pack, dict):
                  return []

              evidence_list = evidence_pack.get("evidence", [])

              if not isinstance(evidence_list, list):
                  return []

              candidates = []

              for evidence in evidence_list:
                  if not isinstance(evidence, dict):
                      continue

                  for field in ("title", "source", "url"):
                      value = _normalise_source(evidence.get(field))

                      if value:
                          candidates.append(value)

              return list(dict.fromkeys(candidates))


          def _validate_source(source, evidence_candidates, block_type):
              source_text = _normalise_source(source)

              if not source_text:
                  raise ValueError(
                      f"content_blocks[{block_type}] 的 source 不能为空"
                  )

              for forbidden_prefix in FORBIDDEN_SOURCE_PREFIXES:
                  if source_text.startswith(_normalise_source(forbidden_prefix)):
                      raise ValueError(
                          f"content_blocks[{block_type}] 使用了禁止的 source：{source}"
                      )

              if "initial_assessment_context" in source_text:
                  raise ValueError(
                      f"content_blocks[{block_type}] 不得使用初次测评上下文作为来源"
                  )

              if block_type == "notice":
                  return

              if not evidence_candidates:
                  raise ValueError(
                      f"content_blocks[{block_type}] 没有可核验的联网证据"
                  )

              matched = any(
                  candidate in source_text or source_text in candidate
                  for candidate in evidence_candidates
              )

              if not matched:
                  raise ValueError(
                      f"content_blocks[{block_type}] 的 source 无法对应联网证据：{source}"
                  )


          def _has_block_content(block):
              content = str(block.get("content", "")).strip()

              if content:
                  return True

              items = block.get("items")
              if isinstance(items, list) and any(str(item).strip() for item in items):
                  return True

              steps = block.get("steps")
              if isinstance(steps, list) and any(str(step).strip() for step in steps):
                  return True

              return False


          def _validate_notice_result(result):
              blocks = result.get("content_blocks")

              if not isinstance(blocks, list) or not blocks:
                  raise ValueError("资料不足结果必须包含 content_blocks")

              for block in blocks:
                  if not isinstance(block, dict):
                      raise ValueError("资料不足结果中的 content_blocks 必须是对象")

                  if block.get("type") != "notice":
                      raise ValueError(
                          "knowledge_insufficient 只能输出 notice 类型区块"
                      )

                  if not _has_block_content(block):
                      raise ValueError("notice 区块不能为空")

                  if not str(block.get("source", "")).strip():
                      raise ValueError("notice 区块必须包含 source")


          def _validate_clarification_result(result):
              question = str(
                  result.get("clarification_question", "")
              ).strip()

              if not question:
                  raise ValueError(
                      "needs_clarification 必须提供 clarification_question"
                  )


          def _validate_success_result(result, context):
              if result.get("delivery_mode") not in DELIVERY_MODES:
                  raise ValueError("delivery_mode 不在允许枚举中")

              if not str(result.get("lesson_title", "")).strip():
                  raise ValueError("lesson_title 不能为空")

              if not str(result.get("lesson_objective", "")).strip():
                  raise ValueError("lesson_objective 不能为空")

              teaching_plan = result.get("teaching_plan")

              if not isinstance(teaching_plan, dict):
                  raise ValueError("teaching_plan 必须是对象")

              if not str(teaching_plan.get("primary_mode", "")).strip():
                  raise ValueError("teaching_plan.primary_mode 不能为空")

              if teaching_plan.get("depth") not in DEPTHS:
                  raise ValueError("teaching_plan.depth 不在允许枚举中")

              blocks = result.get("content_blocks")

              if not isinstance(blocks, list) or not blocks:
                  raise ValueError("content_blocks 不能为空")

              evidence_candidates = _extract_evidence_candidates(context)

              for block in blocks:
                  if not isinstance(block, dict):
                      raise ValueError("content_blocks 每个元素必须是对象")

                  block_type = str(block.get("type", "")).strip()

                  if block_type not in BLOCK_TYPES:
                      raise ValueError(
                          f"content_blocks 存在不允许的 type：{block_type}"
                      )

                  if not _has_block_content(block):
                      raise ValueError(
                          f"content_blocks[{block_type}] 必须包含 content、items 或 steps"
                      )

                  _validate_source(
                      block.get("source"),
                      evidence_candidates,
                      block_type,
                  )

              understanding_check = result.get("understanding_check")

              if not isinstance(understanding_check, dict):
                  raise ValueError("understanding_check 必须是对象")

              if not str(
                  understanding_check.get("question", "")
              ).strip():
                  raise ValueError(
                      "understanding_check.question 不能为空"
                  )

              if result.get("next_action") not in NEXT_ACTIONS:
                  raise ValueError("next_action 不在允许枚举中")


          def _fallback_result():
              return {
                  "status": "system_retryable",
                  "workflow_mode": "learning",
                  "lesson_title": "讲解内容生成中",
                  "lesson_objective": "当前讲解未通过来源校验，请稍后重试",
                  "teaching_plan": {
                      "primary_mode": "interactive_document",
                      "depth": "guided",
                      "reason": "生成结果未通过确定性来源校验",
                  },
                  "content_blocks": [
                      {
                          "type": "notice",
                          "title": "讲解暂不可用",
                          "content": "当前讲解缺少可核验来源，系统不会使用未经验证的内容。请稍后重试。",
                          "source": "校验状态",
                      }
                  ],
                  "understanding_check": {
                      "question": "请稍后重试理解检查",
                      "answer_type": "short_text",
                      "expected_key_points": [],
                  },
                  "actions": ["continue_learning"],
                  "next_action": "continue_learning",
                  "memory_writeback": {
                      "event_type": "learning_explanation",
                      "knowledge_point_id": "",
                      "strategy_code": "generation_fallback",
                      "explanation_mode": "system_retryable",
                      "effect": "pending",
                  },
              }


          def main(model_output, context_json):
              try:
                  context = _parse_json(context_json, "context_json")
                  result = _clean_model_json(model_output)

                  if not isinstance(result, dict):
                      raise ValueError("大模型输出必须是 JSON 对象")

                  status = result.get("status")

                  if status == "needs_clarification":
                      _validate_clarification_result(result)

                  elif status == "knowledge_insufficient":
                      _validate_notice_result(result)

                  elif status == "ok":
                      _validate_success_result(result, context)

                  else:
                      raise ValueError(
                          "status 必须为 ok、needs_clarification 或 knowledge_insufficient"
                      )

                  result["workflow_mode"] = "learning"

                  return {
                      "final_result_json": json.dumps(
                          result,
                          ensure_ascii=False,
                          separators=(",", ":"),
                      )
                  }

              except Exception:
                  return {
                      "final_result_json": json.dumps(
                          _fallback_result(),
                          ensure_ascii=False,
                          separators=(",", ":"),
                      )
                  }
