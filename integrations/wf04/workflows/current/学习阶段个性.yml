      nodeParam:
        uid: '21880654528'
        code: |
          import json


          def main(context, kb_text):
              data = json.loads(str(context or "{}"), strict=False)
              if not isinstance(data, dict):
                  raise ValueError("context 必须是 JSON 对象")
              kb = str(kb_text or "").strip()
              # 后端知识库正文带来源行；弱回退文本带「未提供独立知识库正文」标记。
              kb_available = bool(kb) and "未提供独立知识库正文" not in kb
              target = data.get("current_knowledge_point") or data.get("learning_target")
              if not isinstance(target, dict) or not target:
                  target = {}
              evaluation = data.get("validated_evaluation")
              if isinstance(evaluation, dict):
                  errors = evaluation.get("error_points")
                  if isinstance(errors, list) and errors and isinstance(errors[0], dict):
                      target = errors[0]
              parts = [
                  str(target.get("knowledge_point_name") or target.get("knowledge_point_id") or "").strip()
              ]
              goal = data.get("learning_goal")
              if isinstance(goal, dict) and str(goal.get("goal_name", "")).strip():
                  parts.append(str(goal.get("goal_name")).strip())
              for key in ("student_evidence", "diagnosis", "root_cause", "expected_behavior", "error_description"):
                  value = str(target.get(key, "")).strip()
                  if value:
                      parts.append(value)
              query = " ".join(part for part in parts if part)
              if query:
                  query += " 原理 规范 标准"
              return {"kb_available": kb_available, "web_search_query": query}
        appId: 6545ca99
        codeErrMsg: ''
