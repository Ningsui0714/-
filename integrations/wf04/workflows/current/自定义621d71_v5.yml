        uid: '21880654528'
        code: |
          import json
          import re


          NEXT_ACTIONS = {"answer_check", "continue_learning", "show_example", "switch_explanation"}


          def _json_text(value):
              return json.dumps(value, ensure_ascii=False, separators=(",", ":"))


          def _load_json(value):
              if isinstance(value, dict):
                  return value
              text = str(value or "").strip()
              text = re.sub(r"^```(?:json)?\s*", "", text, flags=re.I)
              text = re.sub(r"\s*```$", "", text)
              start = text.find("{")
              end = text.rfind("}")
              if start < 0 or end < start:
                  raise ValueError("大模型输出中未找到 JSON 对象")
              result = json.loads(text[start:end + 1], strict=False)
              if not isinstance(result, dict):
                  raise ValueError("大模型输出必须是 Object")
              return result


          def _failure(message, strategy_json, learning_target_json, evidence_json):
              error_message = str(message)
              final_result = {
                  "status": "system_retryable",
                  "workflow_mode": "learning",
                  "error_class": "system_retriable",
                  "retryable": True,
                  "retry_stage": "learning_generation",
                  "personalized_explanation": "",
                  "understanding_check": {},
                  "learning_strategy_json": strategy_json or "{}",
                  "learning_target_json": learning_target_json or "{}",
                  "evidence_json": evidence_json or "{}",
                  "memory_writeback_json": "{}",
                  "database_writeback_json": "{}",
                  "error_message": error_message,
              }
              return {
                  "output_valid": False,
                  "status": "system_retryable",
                  "personalized_explanation": "",
                  "understanding_check_text": "",
                  "final_result_json": _json_text(final_result),
                  "error_message": error_message,
                  "learning_strategy_json": strategy_json or "{}",
                  "memory_writeback_json": "{}",
                  "database_writeback_json": "{}",
              }


          def main(model_output, strategy_json, learning_target_json, context_json, evidence_json):
              try:
                  result = _load_json(model_output)
                  strategy = _load_json(strategy_json)
                  target = _load_json(learning_target_json)
                  context = _load_json(context_json)
                  evidence = _load_json(evidence_json)
                  if str(result.get("status", "")) != "ok":
                      raise ValueError("status 必须为 ok")

                  explanation = str(result.get("personalized_explanation", "")).strip()
                  if len(explanation) < 40:
                      raise ValueError("personalized_explanation 过短或为空")
                  micro_example = str(result.get("micro_example", "")).strip()
                  if not micro_example:
                      raise ValueError("micro_example 不能为空")
                  check = result.get("understanding_check", {})
                  if not isinstance(check, dict) or not str(check.get("question", "")).strip():
                      raise ValueError("understanding_check.question 不能为空")
                  expected = check.get("expected_key_points", [])
                  if not isinstance(expected, list) or not expected:
                      raise ValueError("understanding_check.expected_key_points 不能为空")
                  next_action = str(result.get("next_action", "")).strip()
                  if next_action not in NEXT_ACTIONS:
                      raise ValueError("next_action 不在允许枚举中")

                  student_id = str(context.get("student_id", ""))
                  session_id = str(context.get("session_id", ""))
                  attempt_id = str(context.get("attempt_id", ""))
                  knowledge_id = str(target.get("knowledge_point_id", ""))
                  strategy_code = str(strategy.get("strategy_code", ""))
                  memory = result.get("memory_writeback", {})
                  if not isinstance(memory, dict):
                      memory = {}
                  database = result.get("database_writeback", {})
                  if not isinstance(database, dict):
                      database = {}
                  common = {
                      "student_id": student_id,
                      "session_id": session_id,
                      "attempt_id": attempt_id,
                      "knowledge_point_id": knowledge_id,
                      "strategy_code": strategy_code,
                      "effect": "pending",
                  }
                  memory.update(common)
                  database.update(common)
                  check_text = str(check.get("question", "")).strip()

                  final_result = {
                      "status": "ok",
                      "workflow_mode": "learning",
                      "delivery_mode": str(result.get("delivery_mode", "first")),
                      "knowledge_point_summary": str(result.get("knowledge_point_summary", "")),
                      "personalized_explanation": explanation,
                      "micro_example": micro_example,
                      "common_misconception": str(result.get("common_misconception", "")),
                      "workplace_application": str(result.get("workplace_application", "")),
                      "understanding_check": check,
                      "next_action": next_action,
                      "learning_strategy_json": _json_text(strategy),
                      "learning_target_json": _json_text(target),
                      "evidence_json": _json_text(evidence),
                      "memory_writeback_json": _json_text(memory),
                      "database_writeback_json": _json_text(database),
                      "error_message": "",
                  }
                  return {
                      "output_valid": True,
                      "status": "ok",
                      "personalized_explanation": explanation + "\n\n最小示例/步骤\n" + micro_example,
                      "understanding_check_text": check_text,
                      "final_result_json": _json_text(final_result),
                      "error_message": "",
                      "learning_strategy_json": _json_text(strategy),
                      "memory_writeback_json": _json_text(memory),
                      "database_writeback_json": _json_text(database),
                  }
              except Exception as exc:
                  return _failure(exc, strategy_json, learning_target_json, evidence_json)
