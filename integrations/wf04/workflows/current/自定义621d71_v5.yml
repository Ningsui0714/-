      nodeParam:
        uid: '21880654528'
        code: |-
          import json
          import re


          NEXT_ACTIONS = {
              "retry_original",
              "generate_variant",
              "continue_resume",
              "advance",
              "review",
          }


          def _json_text(value):
              return json.dumps(value, ensure_ascii=False, separators=(",", ":"))


          def _load_json(value):
              if isinstance(value, dict):
                  return value
              text = str(value or "").strip()
              text = re.sub(r"^```(?:json)?\s*", "", text, flags=re.I)
              text = re.sub(r"\s*```$", "", text)
              start = text.find("{")
              end = text.rfind("}")
              if start < 0 or end < start:
                  raise ValueError("大模型输出中未找到 JSON 对象")
              result = json.loads(text[start:end + 1], strict=False)
              if not isinstance(result, dict):
                  raise ValueError("大模型输出必须是 Object")
              return result


          def _failure(message, strategy_json, target_error_json, evidence_json):
              error_message = str(message)
              final_result = {
                  "status": "system_retryable",
                  "workflow_mode": "remediation",
                  "error_class": "system_retriable",
                  "retryable": True,
                  "retry_stage": "llm_generation",
                  "personalized_explanation": "",
                  "teaching_strategy_json": strategy_json or "{}",
                  "target_error_json": target_error_json or "{}",
                  "evidence_json": evidence_json or "{}",
                  "retry_guidance": "",
                  "variant_practice_request_json": "{}",
                  "next_action": "review",
                  "memory_writeback_json": "{}",
                  "database_writeback_json": "{}",
                  "error_message": error_message,
              }
              return {
                  "output_valid": False,
                  "status": "system_retryable",
                  "personalized_explanation": "",
                  "teaching_strategy_json": strategy_json or "{}",
                  "target_error_json": target_error_json or "{}",
                  "retry_guidance": "",
                  "variant_practice_request_json": "{}",
                  "next_action": "review",
                  "memory_writeback_json": "{}",
                  "database_writeback_json": "{}",
                  "memory_write_text": "",
                  "final_result_json": _json_text(final_result),
                  "error_message": error_message,
              }


          def main(model_output, strategy_json, target_error_json, context_json, evidence_json):
              try:
                  if model_output is None or (isinstance(model_output, str) and not model_output.strip()):
                      raise ValueError("model_output 为空或仅含空白，LLM 节点可能未返回有效内容")
                  result = _load_json(model_output)
                  strategy = _load_json(strategy_json)
                  target = _load_json(target_error_json)
                  context = _load_json(context_json)
                  evidence = _load_json(evidence_json)

                  if str(result.get("status", "")) != "ok":
                      raise ValueError("status 必须为 ok")

                  explanation = str(result.get("personalized_explanation", "")).strip()
                  if len(explanation) < 40:
                      raise ValueError("personalized_explanation 过短或为空")

                  retry_guidance = str(result.get("retry_guidance", "")).strip()
                  if not retry_guidance:
                      raise ValueError("retry_guidance 不能为空")

                  next_action = str(result.get("next_action", "")).strip()
                  if next_action not in NEXT_ACTIONS:
                      raise ValueError("next_action 不在允许枚举中")

                  variant = result.get("variant_practice_request", {})
                  if not isinstance(variant, dict):
                      raise ValueError("variant_practice_request 必须是 Object")

                  memory = result.get("memory_writeback", {})
                  if not isinstance(memory, dict):
                      memory = {}
                  database = result.get("database_writeback", {})
                  if not isinstance(database, dict):
                      database = {}

                  student_id = str(context.get("student_id", ""))
                  session_id = str(context.get("session_id", ""))
                  attempt_id = str(context.get("attempt_id", ""))
                  knowledge_id = str(target.get("knowledge_point_id", ""))
                  strategy_code = str(strategy.get("strategy_code", ""))

                  memory.update({
                      "student_id": student_id,
                      "session_id": session_id,
                      "attempt_id": attempt_id,
                      "knowledge_point_id": knowledge_id,
                      "strategy_code": strategy_code,
                      "effect": "pending",
                  })
                  database.update({
                      "student_id": student_id,
                      "session_id": session_id,
                      "attempt_id": attempt_id,
                      "knowledge_point_id": knowledge_id,
                      "strategy_code": strategy_code,
                      "effect": "pending",
                  })

                  target_summary = str(result.get("target_error_summary", "")).strip()
                  memory_text = (
                      "个性化讲解事件：学生=" + student_id
                      + "；知识点=" + knowledge_id
                      + "；策略=" + strategy_code
                      + "；聚焦=" + target_summary
                      + "；效果待原题重做或变式练习后更新。"
                  )

                  final_result = {
                      "status": "ok",
                      "workflow_mode": "remediation",
                      "personalized_explanation": explanation,
                      "teaching_strategy_json": _json_text(strategy),
                      "target_error_json": _json_text(target),
                      "evidence_json": _json_text(evidence),
                      "retry_guidance": retry_guidance,
                      "variant_practice_request_json": _json_text(variant),
                      "next_action": next_action,
                      "memory_writeback_json": _json_text(memory),
                      "database_writeback_json": _json_text(database),
                      "error_message": "",
                  }

                  return {
                      "output_valid": True,
                      "status": "ok",
                      "personalized_explanation": explanation,
                      "teaching_strategy_json": _json_text(strategy),
                      "target_error_json": _json_text(target),
                      "retry_guidance": retry_guidance,
                      "variant_practice_request_json": _json_text(variant),
                      "next_action": next_action,
                      "memory_writeback_json": _json_text(memory),
                      "database_writeback_json": _json_text(database),
                      "memory_write_text": memory_text,
                      "final_result_json": _json_text(final_result),
                      "error_message": "",
                  }
              except Exception as exc:
                  return _failure(exc, strategy_json, target_error_json, evidence_json)
