        uid: '21880654528'
        code: |-
          import json


          SEVERITY_ORDER = {"high": 3, "medium": 2, "low": 1}


          def _json_text(value):
              return json.dumps(value, ensure_ascii=False, separators=(",", ":"))


          def _number(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return float(default)


          def _mastery_percent(value):
              mastery = _number(value, 0)
              if 0 <= mastery <= 1:
                  mastery *= 100
              return max(0.0, min(100.0, mastery))


          def _find_state(state, knowledge_id):
              points = state.get("knowledge_points", [])
              if isinstance(points, list):
                  for item in points:
                      if isinstance(item, dict) and str(item.get("knowledge_point_id", "")) == knowledge_id:
                          return item
                  if points and isinstance(points[0], dict):
                      return points[0]
              return state if isinstance(state, dict) else {}


          def _repeat_count(history, knowledge_id, error_type):
              best = 0
              items = history.get("recurring_errors", [])
              if isinstance(items, list):
                  for item in items:
                      if not isinstance(item, dict):
                          continue
                      same_kp = str(item.get("knowledge_point_id", "")) == knowledge_id
                      same_type = str(item.get("error_type", "")) == error_type
                      if same_kp and (same_type or not error_type):
                          best = max(best, int(_number(item.get("count", 0), 0)))
              return best


          def main(context_json):
              context = json.loads(context_json or "{}")
              evaluation = context.get("validated_evaluation", {})
              question = context.get("question_snapshot", {})
              attempt = context.get("current_attempt", {})
              state = context.get("knowledge_state", {})
              history = context.get("history_memory", {})
              profile = context.get("student_profile", {})
              resume = context.get("resume_state", {})
              route_type = str(context.get("route_type", "first_learning"))
              status = str(context.get("evaluation_status", "incorrect"))

              workflow_mode = str(context.get("workflow_mode", "remediation"))
              if workflow_mode == "learning":
                  learning_target = context.get("learning_target", {})
                  learning_state = context.get("learning_state", {})
                  learner_action = str(context.get("learner_action", "first"))
                  knowledge_id = str(learning_target.get("knowledge_point_id", ""))
                  knowledge_name = str(learning_target.get("knowledge_point_name", learning_target.get("topic", "")))
                  mastery = _mastery_percent(learning_state.get("mastery_hint", state.get("mastery", 0)))

                  ineffective = learning_state.get("ineffective_modes", history.get("ineffective_explanation_modes", []))
                  if not isinstance(ineffective, list):
                      ineffective = []
                  previous_modes = learning_state.get("previous_explanation_modes", [])
                  if not isinstance(previous_modes, list):
                      previous_modes = []

                  if learner_action == "alternative" or ineffective:
                      strategy_code = "alternative_representation"
                  elif learner_action == "example":
                      strategy_code = "worked_example"
                  elif learner_action == "steps":
                      strategy_code = "step_by_step"
                  elif learner_action in {"check_understanding", "check_answer"}:
                      strategy_code = "concept_check_feedback"
                  elif route_type == "resume_learning" or learner_action == "continue":
                      strategy_code = "resume_scaffold"
                  else:
                      strategy_code = "concept_to_example"

                  candidates = ["analogy", "worked_example", "execution_trace", "comparison", "counterexample"]
                  usable_modes = [mode for mode in candidates if mode not in ineffective]
                  preferred_mode = usable_modes[0] if usable_modes else "worked_example"
                  if learner_action == "example" and "worked_example" not in ineffective:
                      preferred_mode = "worked_example"
                  elif learner_action == "steps" and "execution_trace" not in ineffective:
                      preferred_mode = "execution_trace"

                  explanation_depth = "foundational" if mastery < 40 else "guided" if mastery < 80 else "concise"
                  delivery_mode = "resume" if route_type == "resume_learning" else "first"
                  target = {
                      "error_id": "LEARNING_TARGET",
                      "knowledge_point_id": knowledge_id,
                      "knowledge_point_name": knowledge_name,
                      "error_type": "none",
                      "student_evidence": "",
                      "expected_behavior": "完成本知识点的理解、示例迁移和理解检查",
                      "diagnosis": "学习阶段不预设学生答错",
                      "root_cause": "",
                      "severity": "low",
                      "confidence": 1.0,
                      "prerequisite_gap": learning_state.get("prerequisite_gap", []),
                      "remediation_target": "掌握并能应用 " + knowledge_name,
                  }
                  strategy = {
                      "workflow_mode": "learning",
                      "strategy_code": strategy_code,
                      "delivery_mode": delivery_mode,
                      "explanation_depth": explanation_depth,
                      "learner_action": learner_action,
                      "preferred_representation": preferred_mode,
                      "previous_explanation_modes": previous_modes,
                      "avoid_repeating_strategies": ineffective,
                      "include_concept_explanation": True,
                      "include_minimal_example": True,
                      "include_understanding_check": True,
                      "do_not_assume_student_error": True,
                      "do_not_update_mastery_here": True,
                  }
                  query_parts = [
                      "目标知识点=" + knowledge_id,
                      "知识点名称=" + knowledge_name,
                      "学习动作=" + learner_action,
                      "检索要求=返回定义、前置知识、关键步骤、最小示例、常见误区、岗位应用、安全边界和理解检查依据",
                  ]
                  return {
                      "strategy_code": strategy_code,
                      "delivery_mode": delivery_mode,
                      "explanation_depth": explanation_depth,
                      "knowledge_query": "\n".join(query_parts),
                      "teaching_strategy_json": _json_text(strategy),
                      "target_error_json": _json_text(target),
                      "mastery": round(mastery, 2),
                      "wrong_streak": 0,
                      "correct_streak": 0,
                      "need_retry": False,
                      "need_variant": False,
                      "resume_focus": str(learning_state.get("resume_focus", "")),
                      "workflow_mode": "learning",
                      "learning_strategy_json": _json_text(strategy),
                  }

              errors = evaluation.get("error_points", [])
              errors = [item for item in errors if isinstance(item, dict)]
              errors.sort(
                  key=lambda item: (
                      SEVERITY_ORDER.get(str(item.get("severity", "low")).lower(), 0),
                      _number(item.get("confidence", 0), 0),
                  ),
                  reverse=True,
              )

              if errors:
                  target = errors[0]
              else:
                  question_points = question.get("knowledge_points", [])
                  fallback_kp = question_points[0] if isinstance(question_points, list) and question_points else {}
                  target = {
                      "error_id": "NO_ERROR",
                      "knowledge_point_id": fallback_kp.get("knowledge_point_id", ""),
                      "knowledge_point_name": fallback_kp.get("knowledge_point_name", ""),
                      "error_type": "none",
                      "student_evidence": "本次评价未发现错误",
                      "expected_behavior": "保持当前正确方法并完成迁移练习",
                      "diagnosis": evaluation.get("summary", "本次作答正确"),
                      "root_cause": "",
                      "severity": "low",
                      "confidence": 1.0,
                      "prerequisite_gap": [],
                      "remediation_target": "巩固并迁移当前知识点",
                  }

              knowledge_id = str(target.get("knowledge_point_id", ""))
              error_type = str(target.get("error_type", ""))
              kp_state = _find_state(state, knowledge_id)
              mastery = _mastery_percent(kp_state.get("mastery", state.get("mastery", 0)))
              wrong_streak = int(_number(kp_state.get("wrong_streak", 0), 0))
              correct_streak = int(_number(kp_state.get("correct_streak", 0), 0))
              repeat_count = max(wrong_streak, _repeat_count(history, knowledge_id, error_type))

              prerequisite_gap = target.get("prerequisite_gap", [])
              if isinstance(prerequisite_gap, str):
                  prerequisite_gap = [prerequisite_gap] if prerequisite_gap.strip() else []
              if not isinstance(prerequisite_gap, list):
                  prerequisite_gap = []

              if status == "correct":
                  strategy_code = "advance_challenge" if mastery >= 80 and correct_streak >= 2 else "consolidate_transfer"
              elif prerequisite_gap:
                  strategy_code = "prerequisite_repair"
              elif repeat_count >= 2:
                  strategy_code = "alternative_representation"
              elif error_type in {"procedure_error", "operation_error", "code_logic_error"}:
                  strategy_code = "trace_and_debug"
              else:
                  strategy_code = "targeted_explanation"

              if mastery < 40:
                  explanation_depth = "foundational"
              elif mastery < 70:
                  explanation_depth = "guided"
              else:
                  explanation_depth = "concise"

              if route_type == "resume_learning":
                  delivery_mode = "resume"
                  resume_focus = str(
                      resume.get("pending_stage")
                      or resume.get("pending_action")
                      or resume.get("last_completed_stage")
                      or "personalized_explanation"
                  )
              elif route_type == "history_review":
                  delivery_mode = "review"
                  resume_focus = "history_review"
              else:
                  delivery_mode = "first"
                  resume_focus = ""

              preferred_style = str(profile.get("preferred_explanation_style", "step_by_step"))
              preferred_example = str(profile.get("preferred_example_type", "small_data_case"))
              ineffective = []
              for item in history.get("previous_explanations", []):
                  if isinstance(item, dict) and str(item.get("effect", "")) == "ineffective":
                      ineffective.append(str(item.get("strategy", "")))

              need_retry = status != "correct"
              need_variant = status == "correct" or mastery < 85
              if route_type == "variant_practice":
                  need_retry = False
                  need_variant = True

              strategy = {
                  "strategy_code": strategy_code,
                  "delivery_mode": delivery_mode,
                  "resume_focus": resume_focus,
                  "explanation_depth": explanation_depth,
                  "mastery_percent": round(mastery, 2),
                  "wrong_streak": wrong_streak,
                  "correct_streak": correct_streak,
                  "same_error_count": repeat_count,
                  "preferred_style": preferred_style,
                  "preferred_example_type": preferred_example,
                  "avoid_repeating_strategies": ineffective,
                  "need_original_retry": need_retry,
                  "need_variant_practice": need_variant,
                  "variant_trigger": "after_retry_pass" if need_retry else "immediate",
                  "do_not_update_mastery_here": True,
              }

              query_parts = [
                  "任务ID=" + str(question.get("task_id", "")),
                  "题目=" + str(question.get("question_text", "")),
                  "目标知识点=" + knowledge_id,
                  "知识点名称=" + str(target.get("knowledge_point_name", "")),
                  "错误类型=" + error_type,
                  "学生证据=" + str(target.get("student_evidence", "")),
                  "正确要求=" + str(target.get("expected_behavior", "")),
                  "根因=" + str(target.get("root_cause", "")),
                  "补救目标=" + str(target.get("remediation_target", "")),
                  "前置缺口=" + ",".join(str(x) for x in prerequisite_gap),
                  "学生当前答案=" + str(attempt.get("student_answer", "")),
                  "检索要求=返回对应知识点、前置知识、常见错误、最小示例、岗位应用和安全边界",
              ]

              return {
                  "strategy_code": strategy_code,
                  "delivery_mode": delivery_mode,
                  "explanation_depth": explanation_depth,
                  "knowledge_query": "\n".join(query_parts),
                  "teaching_strategy_json": _json_text(strategy),
                  "target_error_json": _json_text(target),
                  "mastery": round(mastery, 2),
                  "wrong_streak": wrong_streak,
                  "correct_streak": correct_streak,
                  "need_retry": need_retry,
                  "need_variant": need_variant,
                  "resume_focus": resume_focus,
                  "workflow_mode": "remediation",
                  "learning_strategy_json": "{}",
              }
