                contentErrMsg: ''
            nameErrMsg: ''
            fileType: ''
          - id: 8a8911ac-903a-56ee-afde-297629f70cb7
            name: student_id
            schema:
              type: string
              value:
                type: ref
                content: {name: student_id, id: 3aec94b8-b1a4-562d-819d-be9df157cadd, nodeId: 'ifly-code::63a14c7a-e358-5ccc-bf15-e337d69bbd6f'}
                contentErrMsg: ''
            nameErrMsg: ''
            fileType: ''
        outputs:
          - id: a994bab6-76dd-5351-bced-9c9d700786ba
            name: final_result_json
            schema: {type: string, default: ''}
            nameErrMsg: ''
            required: false
        nodeParam:
          code: |-
            import json
            import re
            from datetime import datetime, timezone


            STYLES = {"procedural_learner", "example_driven", "visual_preferred", "balanced"}
            ABILITY_DIMENSIONS = ("理解能力", "应用能力", "推理能力", "表达能力", "复盘能力", "迁移能力")
            STYLE_KEYS = ("visual", "auditory", "kinesthetic", "reading")
            BALANCED_DISTRIBUTION = {"visual": 0.25, "auditory": 0.25, "kinesthetic": 0.25, "reading": 0.25}


            def main(model_output, event_count, student_id):
                try:
                    text = re.sub(r"^```(?:json)?\s*|\s*```$", "", str(model_output or "").strip(), flags=re.I)
                    start, end = text.find("{"), text.rfind("}")
                    if start < 0 or end < start:
                        raise ValueError("大模型输出中未找到 JSON 对象")
                    result = json.loads(text[start:end + 1], strict=False)
                    model = result.get("student_model")
                    defaults = result.get("strategy_defaults")
                    if not isinstance(model, dict) or not isinstance(defaults, dict):
                        raise ValueError("画像或默认策略不是对象")
                    if model.get("learning_style") not in STYLES:
                        raise ValueError("learning_style 不在允许枚举中")
                    pace = float(model.get("pace_factor", 1.0))
                    model["pace_factor"] = max(0.5, min(pace, 1.5))
                    if not isinstance(model.get("effective_modes", {}), dict):
                        raise ValueError("effective_modes 必须是对象")
                    if not isinstance(model.get("ineffective_modes", []), list):
                        raise ValueError("ineffective_modes 必须是数组")
                    filled_defaults = False
                    ability_scores = result.get("ability_scores")
                    if not isinstance(ability_scores, dict):
                        ability_scores = {}
                        filled_defaults = True
                    normalized_scores = {}
                    for dim in ABILITY_DIMENSIONS:
                        entry = ability_scores.get(dim)
                        if not isinstance(entry, dict):
                            entry = {"score": 50, "confidence": 0.3}
                            filled_defaults = True
                        try:
                            score = max(0.0, min(100.0, float(entry.get("score", 50))))
                            confidence = max(0.0, min(1.0, float(entry.get("confidence", 0.3))))
                        except (TypeError, ValueError):
                            score, confidence = 50.0, 0.3
                            filled_defaults = True
                        normalized_scores[dim] = {
                            "score": round(score, 1),
                            "confidence": round(confidence, 2),
                        }
                    result["ability_scores"] = normalized_scores
                    distribution = result.get("learning_style_distribution")
                    if not isinstance(distribution, dict):
                        distribution = {}
                        filled_defaults = True
                    raw = {}
                    total = 0.0
                    for key in STYLE_KEYS:
                        try:
                            value = max(0.0, float(distribution.get(key, 0.0)))
                        except (TypeError, ValueError):
                            value = 0.0
                        raw[key] = value
                        total += value
                    if total <= 0:
                        raw = dict(BALANCED_DISTRIBUTION)
                        filled_defaults = True
                    result["learning_style_distribution"] = {
                        key: round(value / (total if total > 0 else 1.0), 3)
                        for key, value in raw.items()
                    }
                    result["status"] = "ok"
                    result["student_id"] = str(student_id or "")
                    result["generated_at"] = datetime.now(timezone.utc).isoformat()
                    result["based_on_event_count"] = max(0, int(event_count or 0))
                    if filled_defaults:
                        result["is_fallback"] = True
                    return {"final_result_json": json.dumps(result, ensure_ascii=False, separators=(",", ":"))}
                except Exception:
                    fallback = {
                        "status": "ok",
                        "student_id": str(student_id or ""),
                        "student_model": {
                            "learning_style": "balanced",
                            "learning_style_confidence": 0.5,
                            "effective_modes": {"interactive_document": 0.5},
                            "ineffective_modes": [],
                            "misconception_tags": [],
                            "pace_factor": 1.0,
                            "strengths": [],
                            "weaknesses": [],
                            "attention_pattern": "sustained",
                            "scaffold_preference": "moderate",
                        },
                        "ability_scores": {
                            dim: {"score": 50.0, "confidence": 0.3}
                            for dim in ABILITY_DIMENSIONS
                        },
                        "learning_style_distribution": dict(BALANCED_DISTRIBUTION),
                        "strategy_defaults": {
                            "learning_preferred_mode": "interactive_document",
                            "learning_fallback_mode": "worked_example",
                            "remediation_preferred_mode": "trace_and_debug",
                            "same_error_threshold": 2,
                            "prerequisite_check_before_new_topic": False,
                            "understanding_check_difficulty": "same",
                        },
                        "generated_at": datetime.now(timezone.utc).isoformat(),
                        "based_on_event_count": 0,
                        "is_fallback": True,
                    }
                    return {"final_result_json": json.dumps(fallback, ensure_ascii=False, separators=(",", ":"))}
          appId: 6545ca99
          uid: '21880654528'
          codeErrMsg: ''
        updatable: false
        status: ''
        references: []
