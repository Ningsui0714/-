        nodeParam:
          code: |-
            import json


            def _parse_input(raw_input):
                value = raw_input
                for _ in range(3):
                    if isinstance(value, dict):
                        if "input" in value:
                            value = value.get("input")
                            continue
                        if "AGENT_USER_INPUT" in value:
                            value = value.get("AGENT_USER_INPUT")
                            continue
                        return value
                    text = str(value or "").strip()
                    if not text:
                        return {}
                    value = json.loads(text, strict=False)
                if not isinstance(value, dict):
                    raise ValueError("输入必须是 JSON 对象或 JSON 字符串")
                return value


            def _collect_error_types(value, counts):
                if isinstance(value, dict):
                    error_type = str(value.get("error_type", "")).strip()
                    if error_type:
                        counts[error_type] = counts.get(error_type, 0) + 1
                    for item in value.values():
                        _collect_error_types(item, counts)
                elif isinstance(value, list):
                    for item in value:
                        _collect_error_types(item, counts)


            def main(raw_input):
                data = _parse_input(raw_input)
                if not isinstance(data, dict):
                    raise ValueError("输入必须是 JSON 对象")
                student_id = str(data.get("student_id", "")).strip()
                history = data.get("teaching_history", {})
                if not isinstance(history, dict):
                    history = {}
                events = history.get("events", [])
                if not isinstance(events, list):
                    events = []
                events = [item for item in events[-100:] if isinstance(item, dict)]
                history = {"events": events}

                statistics = {}
                for event in events:
                    mode = str(event.get("teaching_mode", "")).strip()
                    if not mode:
                        continue
                    item = statistics.setdefault(
                        mode,
                        {"total": 0, "passed": 0, "not_understood": 0},
                    )
                    item["total"] += 1
                    effect = str(event.get("effect", "")).strip().lower()
                    if effect == "passed":
                        item["passed"] += 1
                    elif effect == "not_understood":
                        item["not_understood"] += 1
                mode_statistics = {
                    mode: {
                        **statistics[mode],
                        "pass_rate": round(
                            statistics[mode]["passed"] / statistics[mode]["total"],
                            2,
                        ),
                    }
                    for mode in sorted(statistics)
                }

                error_counts = {}
                _collect_error_types(data, error_counts)
                recurring_errors = {
                    error_type: error_counts[error_type]
                    for error_type in sorted(error_counts)
                    if error_counts[error_type] >= 2
                }

                knowledge = data.get("knowledge_state", {})
                practice = data.get("practice_results", [])
                preferences = data.get("resource_preferences", {})
                return {
                    "student_id": student_id,
                    "teaching_history_json": json.dumps(history, ensure_ascii=False, separators=(",", ":")),
                    "knowledge_state_json": json.dumps(knowledge if isinstance(knowledge, dict) else {}, ensure_ascii=False, separators=(",", ":")),
                    "practice_results_json": json.dumps(practice[-100:] if isinstance(practice, list) else [], ensure_ascii=False, separators=(",", ":")),
                    "resource_preferences_json": json.dumps(preferences if isinstance(preferences, dict) else {}, ensure_ascii=False, separators=(",", ":")),
                    "mode_statistics_json": json.dumps(mode_statistics, ensure_ascii=False, separators=(",", ":")),
                    "recurring_errors_json": json.dumps(recurring_errors, ensure_ascii=False, separators=(",", ":")),
                    "event_count": max(0, int(data.get("event_count", 0) or 0)),
                }
          appId: 6545ca99
          uid: '21880654528'
          codeErrMsg: ''
        updatable: false
        status: ''
        references: []
