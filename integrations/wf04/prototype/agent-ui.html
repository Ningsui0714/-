<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知行课径 Agent · UI 原型</title>
  <script src="../frontend/vendor/lucide.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f2f4f0;
      --surface: #ffffff;
      --surface-soft: #f8faf7;
      --ink: #18201d;
      --muted: #57615c;
      --muted-soft: #aeb9b3;
      --line: #dce2dd;
      --line-strong: #c6cec8;
      --green: #1f6b55;
      --green-soft: #e7f2ec;
      --green-strong: #195a47;
      --blue: #2859c5;
      --blue-soft: #e9effc;
      --amber: #b96b18;
      --amber-soft: #fff2df;
      --red: #ae3b3b;
      --red-soft: #fbeaea;
      --shadow: 0 8px 22px rgba(24, 32, 29, 0.08);
      --shadow-lg: 0 16px 40px rgba(24, 32, 29, 0.16);
      --radius: 12px;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    button, textarea, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    svg { display: block; width: 18px; height: 18px; stroke-width: 1.8; }
    [hidden] { display: none !important; }

    .app { display: flex; flex-direction: column; height: 100vh; }

    /* ---------- 顶栏 ---------- */
    .topbar {
      height: 54px; flex: none; display: flex; align-items: center; gap: 12px;
      padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line);
      z-index: 30;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 9px; background: var(--green);
      color: #fff; display: flex; align-items: center; justify-content: center;
    }
    .brand-mark svg { width: 17px; height: 17px; }
    .brand-copy strong { font-size: 15px; display: block; line-height: 1.2; }
    .brand-copy small { color: var(--muted-soft); font-size: 11px; }
    .topbar-spacer { flex: 1; }
    .prototype-badge {
      font-size: 11px; color: var(--amber); background: var(--amber-soft);
      border: 1px solid #f1d7b2; border-radius: 999px; padding: 3px 10px;
    }
    .topbar-user { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; background: var(--green-soft);
      color: var(--green-strong); font-size: 13px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
    }

    /* ---------- 三栏布局 ---------- */
    .layout { flex: 1; display: grid; grid-template-columns: 290px minmax(0, 1fr) 400px; min-height: 0; }

    /* ---------- 左栏：项目树 ---------- */
    .sidebar {
      background: var(--surface); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; min-height: 0;
    }
    .sidebar-head {
      padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .sidebar-head strong { font-size: 13px; color: var(--muted); letter-spacing: 1px; }
    .new-project-btn {
      display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600;
      background: var(--green); color: #fff; border: none; border-radius: 8px; padding: 6px 10px;
    }
    .new-project-btn:hover { background: var(--green-strong); }
    .project-tree { flex: 1; overflow-y: auto; padding: 10px 8px; }

    .tree-empty { padding: 26px 16px; text-align: center; color: var(--muted-soft); font-size: 13px; line-height: 1.7; }
    .tree-empty svg { width: 30px; height: 30px; margin: 0 auto 8px; opacity: .5; }

    .project-node { margin-bottom: 6px; border-radius: 10px; }
    .project-node.open { background: var(--surface-soft); }
    .project-header {
      width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 10px;
      background: none; border: none; border-radius: 10px; text-align: left; font-size: 13px; font-weight: 600;
    }
    .project-header:hover { background: var(--surface-soft); }
    .project-header .chev { color: var(--muted-soft); transition: transform .18s; }
    .project-node.open .chev { transform: rotate(90deg); }
    .project-header .folder { color: var(--green); }
    .project-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .project-meta { font-size: 11px; color: var(--muted-soft); font-weight: 400; }

    .path-list { list-style: none; margin: 2px 0 8px; padding: 0; }
    .path-item { position: relative; }
    .path-item button {
      width: 100%; display: flex; align-items: center; gap: 9px; padding: 8px 10px 8px 16px;
      background: none; border: none; border-radius: 9px; text-align: left; font-size: 12.5px; color: var(--ink-soft);
    }
    .path-item button:hover { background: var(--green-soft); }
    .path-item.active button { background: var(--green-soft); color: var(--green-strong); font-weight: 600; }
    .path-state {
      flex: none; width: 18px; height: 18px; border-radius: 50%; font-size: 10px;
      display: flex; align-items: center; justify-content: center;
      background: var(--line); color: var(--muted);
    }
    .path-item.done .path-state { background: var(--green); color: #fff; }
    .path-item.current .path-state { background: var(--amber); color: #fff; }
    .path-item.locked .path-state { background: transparent; color: var(--muted-soft); }
    .path-item.locked button { color: var(--muted-soft); }
    .path-copy { flex: 1; min-width: 0; }
    .path-copy small { display: block; font-size: 10.5px; color: var(--muted-soft); margin-bottom: 1px; }
    .path-copy strong { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
    .path-duration { font-size: 10.5px; color: var(--muted-soft); flex: none; }

    .sidebar-foot { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 9px; font-size: 12.5px; }
    .sidebar-foot small { color: var(--muted-soft); display: block; }

    /* ---------- 中央：欢迎屏 / 讲解页 ---------- */
    .stage { min-height: 0; overflow-y: auto; background: var(--bg); }

    .welcome {
      height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px; text-align: center;
    }
    .welcome-icon {
      width: 64px; height: 64px; border-radius: 20px; background: var(--green);
      color: #fff; display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
      box-shadow: var(--shadow);
    }
    .welcome-icon svg { width: 30px; height: 30px; }
    .welcome h1 { margin: 0 0 8px; font-size: 22px; }
    .welcome p { margin: 0 0 26px; color: var(--muted); max-width: 420px; line-height: 1.7; font-size: 13.5px; }
    .welcome-steps { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .welcome-step {
      width: 200px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px; text-align: left; box-shadow: var(--shadow);
    }
    .welcome-step .num {
      width: 24px; height: 24px; border-radius: 50%; background: var(--green-soft); color: var(--green-strong);
      font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;
    }
    .welcome-step strong { font-size: 13.5px; display: block; margin-bottom: 5px; }
    .welcome-step small { color: var(--muted); font-size: 12px; line-height: 1.6; display: block; }

    .lesson { max-width: 760px; margin: 0 auto; padding: 28px 32px 60px; }
    .lesson-crumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-soft); margin-bottom: 14px; }
    .lesson-crumb .sep { opacity: .6; }
    .lesson-crumb button { background: none; border: none; color: var(--green); font-size: 12px; padding: 0; }
    .lesson-head { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; box-shadow: var(--shadow); }
    .lesson-tag {
      display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
      color: var(--green-strong); background: var(--green-soft); border-radius: 999px; padding: 3px 10px; margin-bottom: 10px;
    }
    .lesson-head h1 { margin: 0 0 8px; font-size: 21px; }
    .lesson-meta { display: flex; gap: 16px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
    .lesson-meta span { display: inline-flex; align-items: center; gap: 5px; }

    .lesson-body { margin-top: 16px; }
    .lesson-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 22px 24px; margin-bottom: 16px; box-shadow: var(--shadow);
    }
    .lesson-card h3 { margin: 0 0 12px; font-size: 15.5px; display: flex; align-items: center; gap: 8px; }
    .lesson-card h3 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }
    .lesson-card p { margin: 0 0 10px; font-size: 13.5px; line-height: 1.85; color: var(--ink-soft); }
    .lesson-card ul { margin: 0 0 10px; padding-left: 20px; font-size: 13.5px; line-height: 1.85; color: var(--ink-soft); }
    .lesson-card li { margin-bottom: 4px; }
    .code-block {
      background: #1b2521; color: #d8e6df; border-radius: 10px; padding: 14px 16px; margin: 10px 0 14px;
      font-family: Consolas, "Courier New", monospace; font-size: 12.5px; line-height: 1.7; overflow-x: auto;
    }
    .code-block .cm { color: #7a9188; }
    .code-block .kw { color: #8fc7ff; }
    .code-block .st { color: #ffd9a0; }
    .info-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 10px 0 6px; }
    .info-table th, .info-table td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; }
    .info-table th { background: var(--surface-soft); color: var(--muted); font-weight: 600; }

    .video-card {
      display: flex; align-items: center; gap: 14px; background: var(--surface-soft);
      border: 1px dashed var(--line-strong); border-radius: 10px; padding: 14px 16px; margin-top: 8px;
    }
    .video-card .play {
      flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--amber-soft); color: var(--amber);
      display: flex; align-items: center; justify-content: center;
    }
    .video-card strong { font-size: 13px; display: block; margin-bottom: 3px; }
    .video-card small { color: var(--muted); font-size: 12px; }
    .video-card a {
      margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 5px;
      background: var(--amber); color: #fff; text-decoration: none; font-size: 12.5px; font-weight: 600;
      border-radius: 8px; padding: 8px 14px;
    }
    .video-card a:hover { background: #a35f14; }

    .lesson-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
    .lesson-nav button {
      display: inline-flex; align-items: center; gap: 6px; background: var(--surface);
      border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 16px; font-size: 13px; font-weight: 600;
    }
    .lesson-nav button:hover { border-color: var(--green); color: var(--green-strong); }
    .lesson-nav .mark-done {
      background: var(--green); border-color: var(--green); color: #fff;
    }
    .lesson-nav .mark-done:hover { background: var(--green-strong); color: #fff; }

    /* ---------- 右栏：对话框 ---------- */
    .chat {
      background: var(--surface); border-left: 1px solid var(--line);
      display: flex; flex-direction: column; min-height: 0;
    }
    .chat-head {
      padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
    }
    .chat-head .bot-icon {
      width: 32px; height: 32px; border-radius: 10px; background: var(--green); color: #fff;
      display: flex; align-items: center; justify-content: center; flex: none;
    }
    .chat-head strong { font-size: 13.5px; display: block; }
    .chat-head small { font-size: 11px; color: var(--green); display: flex; align-items: center; gap: 4px; }
    .chat-head small::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

    .chat-messages { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
    .msg { display: flex; gap: 10px; max-width: 100%; }
    .msg .bubble-avatar {
      flex: none; width: 28px; height: 28px; border-radius: 9px; font-size: 12px;
      display: flex; align-items: center; justify-content: center;
      background: var(--green-soft); color: var(--green-strong);
    }
    .msg.bot .bubble-avatar { background: var(--green); color: #fff; }
    .msg .bubble {
      background: var(--surface-soft); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; font-size: 13px; line-height: 1.75; color: var(--ink-soft);
      min-width: 0; box-shadow: var(--shadow);
    }
    .msg.user { flex-direction: row-reverse; }
    .msg.user .bubble { background: var(--green); border-color: var(--green); color: #fff; border-top-right-radius: 4px; }
    .msg.bot .bubble { border-top-left-radius: 4px; }
    .msg .bubble p { margin: 0 0 8px; }
    .msg .bubble p:last-child { margin-bottom: 0; }
    .msg .bubble strong { color: var(--ink); }
    .msg.user .bubble strong { color: #fff; }

    .suggestions { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 0; }
    .suggestion-chip {
      font-size: 11.5px; background: var(--surface-soft); border: 1px solid var(--line-strong);
      border-radius: 999px; padding: 5px 11px; color: var(--muted);
    }
    .suggestion-chip:hover { border-color: var(--green); color: var(--green-strong); background: var(--green-soft); }

    .chat-input-box { padding: 10px 14px 14px; border-top: 1px solid var(--line); }
    .chat-input {
      display: flex; align-items: flex-end; gap: 8px; background: var(--surface-soft);
      border: 1px solid var(--line-strong); border-radius: 12px; padding: 8px 8px 8px 14px;
    }
    .chat-input:focus-within { border-color: var(--green); }
    .chat-input textarea {
      flex: 1; border: none; background: none; resize: none; outline: none; font-size: 13px;
      line-height: 1.6; min-height: 22px; max-height: 120px; padding: 4px 0;
    }
    .send-btn {
      flex: none; width: 34px; height: 34px; border-radius: 10px; border: none;
      background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center;
    }
    .send-btn:hover { background: var(--green-strong); }
    .send-btn:disabled { background: var(--line); cursor: default; }

    /* 对话内卡片 */
    .quiz-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 8px; }
    .quiz-card .qc-head { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
    .quiz-card .qc-head svg { color: var(--blue); }
    .quiz-card p { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; }
    .quiz-actions { display: flex; align-items: center; gap: 10px; }
    .primary-btn {
      display: inline-flex; align-items: center; gap: 6px; background: var(--green); color: #fff;
      border: none; border-radius: 9px; padding: 9px 16px; font-size: 13px; font-weight: 600;
    }
    .primary-btn:hover { background: var(--green-strong); }
    .primary-btn.blue { background: var(--blue); }
    .primary-btn.blue:hover { background: #1f47a3; }
    .ghost-link { background: none; border: none; font-size: 12px; color: var(--muted-soft); text-decoration: underline; }

    .analysis-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 8px; }
    .analysis-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .ring {
      width: 56px; height: 56px; border-radius: 50%; flex: none;
      background: conic-gradient(var(--green) 0deg 223deg, var(--line) 223deg 360deg);
      display: flex; align-items: center; justify-content: center;
    }
    .ring::after { content: ""; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); }
    .ring-value { position: absolute; font-size: 12px; font-weight: 700; color: var(--green-strong); }
    .analysis-head .ah-copy { flex: 1; }
    .analysis-head .ah-copy strong { font-size: 14px; display: block; margin-bottom: 3px; }
    .analysis-head .ah-copy small { color: var(--muted); font-size: 12px; }
    .weak-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
    .weak-tag { font-size: 11.5px; background: var(--red-soft); color: var(--red); border-radius: 999px; padding: 4px 10px; }
    .analysis-note { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.7; }
    .analysis-note b { color: var(--green-strong); }

    .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 2px; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted-soft); animation: blink 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: .2s; }
    .typing i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 70%, 100% { opacity: .25; } 35% { opacity: 1; } }

    /* ---------- 测评抽屉 ---------- */
    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(24, 32, 29, .32); z-index: 40; opacity: 0;
      transition: opacity .25s;
    }
    .drawer-backdrop.show { opacity: 1; }
    .quiz-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: 480px; max-width: 92vw; z-index: 50;
      background: var(--surface); box-shadow: var(--shadow-lg);
      transform: translateX(102%); transition: transform .3s cubic-bezier(.2, .8, .25, 1);
      display: flex; flex-direction: column;
    }
    .quiz-drawer.open { transform: translateX(0); }
    .quiz-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
    .quiz-head .qh-icon { color: var(--blue); }
    .quiz-head strong { flex: 1; font-size: 14.5px; }
    .quiz-head .close-btn { background: none; border: none; color: var(--muted); padding: 4px; border-radius: 8px; }
    .quiz-head .close-btn:hover { background: var(--surface-soft); color: var(--ink); }
    .quiz-progress-track { height: 4px; background: var(--line); }
    .quiz-progress-bar { height: 100%; background: var(--blue); transition: width .25s; }
    .quiz-body { flex: 1; overflow-y: auto; padding: 22px 22px 12px; }
    .quiz-body .q-index { font-size: 12px; color: var(--muted-soft); margin-bottom: 8px; }
    .quiz-body h2 { font-size: 16px; margin: 0 0 18px; line-height: 1.6; }
    .option {
      width: 100%; display: flex; align-items: flex-start; gap: 11px; text-align: left;
      background: var(--surface-soft); border: 1.5px solid var(--line); border-radius: 11px;
      padding: 13px 15px; margin-bottom: 10px; font-size: 13.5px; line-height: 1.6;
    }
    .option:hover { border-color: var(--blue); }
    .option.selected { border-color: var(--blue); background: var(--blue-soft); }
    .option .opt-key {
      flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--surface);
      border: 1px solid var(--line-strong); font-size: 11.5px; font-weight: 700; color: var(--muted);
      display: flex; align-items: center; justify-content: center; margin-top: 1px;
    }
    .option.selected .opt-key { background: var(--blue); border-color: var(--blue); color: #fff; }
    .quiz-foot { padding: 14px 22px 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .quiz-foot .primary-btn:disabled { background: var(--line); cursor: default; }
    .quiz-submit-view { padding: 40px 22px; text-align: center; color: var(--muted); font-size: 13.5px; line-height: 2; }
    .quiz-submit-view .done-icon {
      width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%; background: var(--green-soft);
      color: var(--green); display: flex; align-items: center; justify-content: center;
    }
    .quiz-submit-view .done-icon svg { width: 26px; height: 26px; }

    @media (max-width: 1180px) {
      .layout { grid-template-columns: 250px minmax(0, 1fr) 340px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"><i data-lucide="route"></i></span>
        <span class="brand-copy"><strong>知行课径 Agent</strong><small>个性化自适应学习 · 交互原型</small></span>
      </div>
      <div class="topbar-spacer"></div>
      <span class="prototype-badge">UI Prototype v0.1</span>
      <div class="topbar-user">
        <span class="avatar">林</span>
        <span>林同学</span>
      </div>
    </header>

    <div class="layout">
      <!-- 左栏：项目树 -->
      <aside class="sidebar">
        <div class="sidebar-head">
          <strong>项目</strong>
          <button class="new-project-btn" id="new-project-btn"><i data-lucide="plus"></i> 新建项目</button>
        </div>
        <div class="project-tree" id="project-tree"></div>
        <div class="sidebar-foot">
          <span class="avatar">林</span>
          <div><span>林同学</span><small>Java 方向学习者</small></div>
        </div>
      </aside>

      <!-- 中央：欢迎屏 / 讲解页 -->
      <main class="stage" id="stage">
        <div class="welcome" id="welcome-view">
          <div class="welcome-icon"><i data-lucide="sparkles"></i></div>
          <h1>开始你的学习之旅</h1>
          <p>在右侧对话框告诉助手你的学习目标，系统会通过测评了解你的掌握情况，为你生成个性化学习路径。</p>
          <div class="welcome-steps">

  <script>
    /* ================= 演示数据 ================= */
    const QUIZ = [
      { q: "关于 Java 基本数据类型，下列说法正确的是？", options: [
          "int 类型变量的默认值是 null",
          "boolean 类型变量的默认值是 false",
          "String 是基本数据类型",
          "float 类型变量默认值是 0"
        ], answer: 1, explain: "boolean 默认值为 false；int/float 默认值为 0；String 是引用类型。" },
      { q: "下列哪段代码可以正确创建一个对象？", options: [
          "Student stu = new Student;",
          "Student stu = Student();",
          "Student stu = new Student();",
          "new Student();"
        ], answer: 2, explain: "创建对象的标准写法是 new 构造方法()。" },
      { q: "关于封装（Encapsulation），下列说法错误的是？", options: [
          "封装把数据和对数据的操作绑定在一起",
          "封装通过访问修饰符隐藏内部实现细节",
          "封装要求所有成员变量必须用 private 修饰",
          "封装有助于提高代码的安全性和可维护性"
        ], answer: 2, explain: "封装不强制所有变量私有，只是推荐用 private 配合 getter/setter 控制访问。" },
      { q: "子类构造方法中调用父类构造方法，应使用哪个关键字？", options: [
          "this",
          "super",
          "extends",
          "import"
        ], answer: 1, explain: "super() 用于调用父类构造方法，且必须是子类构造方法的第一条语句。" },
      { q: "以下哪个方法签名是合法的 main 方法入口？", options: [
          "public static void main(String[] args)",
          "static public int main(String[] args)",
          "public void main(String args)",
          "public static String main(String[] args)"
        ], answer: 0, explain: "Java 程序入口必须是 public static void main(String[] args)。" }
    ];

    const LESSONS = [
      { num: "01", tag: "基础", title: "数据类型与缺考标记", duration: "20 分钟", status: "done",
        video: null,
        body: [
          ["h3", "本节目标"],
          ["p", "掌握 Java 八种基本数据类型的取值范围与默认值，理解引用类型与基本类型的区别，并能在成绩管理场景中正确处理\"缺考\"这类特殊标记。"],
          ["h3", "核心知识点"],
          ["p", "基本类型分为整型（byte / short / int / long）、浮点型（float / double）、字符型（char）和布尔型（boolean）。它们直接存储值，而引用类型存储对象的地址。"],
          ["code", "// 基本类型默认值\nint score = 0;        // 缺考时用 -1 标记\nboolean passed = false;\nchar grade = 'A';\n// 引用类型默认值为 null\nString name = null;"],
          ["h3", "常见误区"],
          ["ul", "认为 String 是基本类型（实为引用类型）|float 字面量忘记加 f 后缀导致编译错误|把\"缺考\"记为 0 分，造成统计失真"]
        ] },
      { num: "02", tag: "代码", title: "类的定义与对象创建", duration: "30 分钟", status: "done",
        video: null,
        body: [
          ["h3", "本节目标"],
          ["p", "掌握类的定义结构（成员变量、构造方法、成员方法），理解 new 创建对象的内存过程。"],
          ["h3", "核心知识点"],
          ["p", "类是对象的模板，对象是类的实例。构造方法用于初始化对象，方法名与类名相同且没有返回值类型。"],
          ["code", "public class Student {\n    private String name;      // 成员变量\n    public Student(String n) { name = n; }  // 构造方法\n    public void show() { System.out.println(name); }\n}\nStudent s = new Student(\"林同学\");  // 创建对象"],
          ["h3", "常见误区"],
          ["ul", "构造方法写了返回类型（如 void Student()）|成员变量与方法内局部变量同名导致遮蔽|忘记 new 直接调用构造方法"]
        ] },
      { num: "03", tag: "核心", title: "封装与访问控制", duration: "25 分钟", status: "current",
        video: { title: "Java 封装与访问修饰符（视频讲解）", url: "https://www.bilibili.com/video/BV1K54y1i7ER" },
        body: [
          ["h3", "本节目标"],
          ["p", "理解封装的本质：把数据与操作绑定，对外隐藏内部实现；掌握 private / 默认 / protected / public 四种访问修饰符的可见范围，并能写出规范的 getter / setter。"],
          ["h3", "什么是封装"],
          ["p", "封装是面向对象三大特性（封装、继承、多态）之一。它将成员变量声明为 private，通过公开的 getter / setter 方法间接访问，从而在赋值时校验数据合法性，防止外部直接破坏对象内部状态。"],
          ["code", "public class Score {\n    private int value;          // 私有数据，外部不可直接访问\n    public void setValue(int v) {\n        if (v < 0 || v > 100) {  // 赋值前校验\n            throw new IllegalArgumentException(\"成绩必须在 0~100 之间\");\n        }\n        this.value = v;\n    }\n    public int getValue() { return value; }\n}"],
          ["h3", "访问修饰符可见范围"],
          ["table", "修饰符|同类|同包|子类|任意位置\nprivate|✓|—|—|—\n默认（不写）|✓|✓|—|—\nprotected|✓|✓|✓|—\npublic|✓|✓|✓|✓"],
          ["h3", "常见误区"],
          ["ul", "认为所有成员变量都必须私有（应根据设计需要选择）|setter 里不做任何校验，封装形同虚设|把业务方法也全部写成 public，暴露过多细节"]
        ] },
      { num: "04", tag: "边界", title: "继承与方法重写", duration: "35 分钟", status: "locked",
        video: { title: "Java 继承与方法重写（视频讲解）", url: "https://www.bilibili.com/video/BV1Bx411u7rS" },
        body: [
          ["h3", "本节目标"],
          ["p", "掌握 extends 继承关系、super 的用法、方法重写（Override）的规则，理解继承带来的复用与多态基础。"],
          ["h3", "核心知识点"],
          ["p", "子类继承父类的非私有成员。重写要求方法签名相同、访问权限不能更严格。super 用于调用父类构造方法和被重写的方法。"],
          ["code", "public class Graduate extends Student {\n    private String advisor;\n    public Graduate(String n, String a) {\n        super(n);           // 调用父类构造方法\n        this.advisor = a;\n    }\n    @Override\n    public void show() {    // 方法重写\n        super.show();\n        System.out.println(\"导师：\" + advisor);\n    }\n}"],
          ["h3", "常见误区"],
          ["ul", "重写时把参数列表写错变成重载|重写方法缩小了访问权限（如 public 改成 private）|子类构造方法忘记调用 super，父类无默认构造时报错"]
        ] },
      { num: "05", tag: "迁移", title: "统计报告验证", duration: "40 分钟", status: "locked",
        video: null,
        body: [
          ["h3", "本节目标"],
          ["p", "综合运用数据类型、类与对象、封装、继承，完成成绩管理系统的统计报告验证，形成完整实训闭环。"],
          ["h3", "核心知识点"],
          ["p", "本节是综合实训：对全班成绩进行平均分、及格率、缺考人数统计，并用封装好的 Score 类保证数据合法性，用继承体系复用公共逻辑。"],
          ["code", "// 统计核心逻辑示意\nint passed = 0, total = 0;\nfor (Score s : scores) {\n    if (s.getValue() >= 60) passed++;\n    total++;\n}\ndouble passRate = (double) passed / total * 100;"],
          ["h3", "验收标准"],
          ["ul", "缺考记录不参与平均分计算|非法成绩（越界）能被拦截并提示|统计结果与手工核算一致"]
        ] }
    ];

    /* ================= 状态 ================= */
    const state = {
      project: null,          // { name, createdBy }
      pathReady: false,
      quizIndex: 0,
      answers: new Array(QUIZ.length).fill(null),
      currentLesson: -1
    };

    /* ================= 工具 ================= */
    const $ = (id) => document.getElementById(id);
    const messagesEl = $("chat-messages");
    const treeEl = $("project-tree");
    const stageEl = $("stage");
    const welcomeEl = $("welcome-view");
    const lessonEl = $("lesson-view");
    const drawerEl = $("quiz-drawer");
    const backdropEl = $("drawer-backdrop");

    function icons() { if (window.lucide) lucide.createIcons(); }

    function scrollChat() { messagesEl.scrollTop = messagesEl.scrollHeight; }

    function addMsg(role, html) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      const avatar = role === "bot"
        ? '<span class="bubble-avatar"><i data-lucide="sparkles"></i></span>'
        : '<span class="bubble-avatar">我</span>';
      div.innerHTML = avatar + '<div class="bubble">' + html + "</div>";
      messagesEl.appendChild(div);
      icons();
      scrollChat();
      return div;
    }

    function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

    /* ================= 对话流程 ================= */
    async function boot() {
      addMsg("bot", "<p><strong>你好，我是知行课径助手。</strong> 我可以帮你把学习目标转化为个性化的学习路径。</p><p>创建一个项目后，我会先用几道测评题了解你的掌握情况，再为你规划学习顺序。</p>");
      await sleep(600);
      showSuggestions();
    }

    function showSuggestions() {
      const box = $("suggestions");
      box.hidden = false;
      box.innerHTML = "";
      const chips = [
        "我想系统掌握 Java 面向对象编程",
        "我想提升 Java 集合与异常处理",
        "我想准备 Java 开发岗位面试"
      ];
      chips.forEach((c) => {
        const b = document.createElement("button");
        b.className = "suggestion-chip";
        b.textContent = c;
        b.onclick = () => sendGoal(c);
        box.appendChild(b);
      });
    }

    function hideSuggestions() { $("suggestions").hidden = true; }

    function projectNameFor(goal) {
      if (goal.includes("面向对象")) return "Java 面向对象编程实训";
      if (goal.includes("集合")) return "Java 集合与异常处理";
      if (goal.includes("面试")) return "Java 开发岗位面试准备";
      return goal.length > 14 ? goal.slice(0, 14) + "…" : goal;
    }

    async function sendGoal(text) {
      const t = (text || $("chat-textarea").value).trim();
      if (!t) return;
      $("chat-textarea").value = "";
      hideSuggestions();
      setInputEnabled(false);

      addMsg("user", "<strong>" + escapeHtml(t) + "</strong>");
      await sleep(700);

      state.project = { name: projectNameFor(t), goal: t };
      const card =
        "<p><strong>收到！</strong> 你的目标已记录：<strong>" + escapeHtml(state.project.name) +
        "</strong></p><p>为了给你生成真正个性化的学习路径，请先完成 5 道能力测评题（约 3 分钟）。</p>" +
        '<div class="quiz-card">' +
          '<div class="qc-head"><i data-lucide="clipboard-list"></i> 能力测评 · 5 题</div>' +
          "<p>覆盖数据类型、类与对象、封装、继承等核心知识点。完成后系统将立即分析你的薄弱环节。</p>" +
          '<div class="quiz-actions">' +
            '<button class="primary-btn blue" id="start-quiz-btn"><i data-lucide="play"></i> 开始测评</button>' +
            '<button class="ghost-link" id="skip-quiz-btn">跳过，用示例结果演示</button>' +
          "</div>" +
        "</div>";
      const msg = addMsg("bot", card);
      msg.querySelector("#start-quiz-btn").onclick = openQuiz;
      msg.querySelector("#skip-quiz-btn").onclick = () => { removeMsg(msg); finishAnalysis(true); };
      setInputEnabled(true);
    }

    function removeMsg(msgEl) { msgEl.remove(); }

    function setInputEnabled(on) {
      $("send-btn").disabled = !on;
      $("chat-textarea").disabled = !on;
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    /* ================= 测评抽屉 ================= */
    function openQuiz() {
      state.quizIndex = 0;
      state.answers = new Array(QUIZ.length).fill(null);
      $("quiz-title").textContent = "能力测评 · " + state.project.name;
      renderQuiz();
      backdropEl.hidden = false;
      requestAnimationFrame(() => backdropEl.classList.add("show"));
      drawerEl.classList.add("open");
      drawerEl.setAttribute("aria-hidden", "false");
    }

    function closeQuiz() {
      drawerEl.classList.remove("open");
      backdropEl.classList.remove("show");
      setTimeout(() => { backdropEl.hidden = true; }, 250);
      drawerEl.setAttribute("aria-hidden", "true");
    }

    function renderQuiz() {
      const i = state.quizIndex;
      const q = QUIZ[i];
      const progress = ((i + 1) / QUIZ.length) * 100;
      $("quiz-progress-bar").style.width = progress + "%";
      $("quiz-body").innerHTML =
        '<div class="q-index">第 ' + (i + 1) + ' / ' + QUIZ.length + ' 题</div>' +
        "<h2>" + q.q + "</h2>" +
        q.options.map((opt, k) =>
          '<button class="option' + (state.answers[i] === k ? " selected" : "") + '" data-k="' + k + '">' +
            '<span class="opt-key">' + "ABCD"[k] + "</span><span>" + escapeHtml(opt) + "</span></button>"
        ).join("");
      $("quiz-body").querySelectorAll(".option").forEach((b) => {
        b.onclick = () => {
          state.answers[i] = Number(b.dataset.k);
          renderQuiz();
        };
      });
      $("quiz-prev").disabled = i === 0;
      const nextBtn = $("quiz-next");
      if (i === QUIZ.length - 1) {
        nextBtn.innerHTML = "提交测评 <i data-lucide=\"check\"></i>";
        nextBtn.disabled = state.answers[i] === null;
      } else {
        nextBtn.innerHTML = "下一题 <i data-lucide=\"chevron-right\"></i>";
        nextBtn.disabled = state.answers[i] === null;
      }
      icons();
    }

    $("quiz-prev").onclick = () => { state.quizIndex--; renderQuiz(); };
    $("quiz-next").onclick = () => {
      if (state.quizIndex < QUIZ.length - 1) { state.quizIndex++; renderQuiz(); }
      else submitQuiz();
    };
    $("quiz-close").onclick = closeQuiz;
    backdropEl.onclick = closeQuiz;

    function submitQuiz() {
      const correct = state.answers.filter((a, i) => a === QUIZ[i].answer).length;
      $("quiz-body").innerHTML =
        '<div class="quiz-submit-view">' +
          '<div class="done-icon"><i data-lucide="check"></i></div>' +
          "<strong>测评完成</strong><br/>答对 " + correct + " / " + QUIZ.length +
          " 题，正在为你分析掌握情况…</div>";
      $("quiz-prev").disabled = true;
      $("quiz-next").disabled = true;
      setTimeout(() => { closeQuiz(); finishAnalysis(false); }, 1200);
    }

    /* ================= 分析结果 ================= */
    async function finishAnalysis(skipped) {
      setInputEnabled(false);
      const typing = addMsg("bot", '<div class="typing"><i></i><i></i><i></i></div>');
      await sleep(1500);
      typing.remove();

      const card =
        '<div class="analysis-card">' +
          '<div class="analysis-head">' +
            '<div class="ring"><span class="ring-value">62%</span></div>' +
            '<div class="ah-copy">' +
              "<strong>测评分析完成</strong>" +
              "<small>总体掌握度 62% · " + (skipped ? "示例数据" : "依据本次作答") + "</small>" +
            "</div>" +
          "</div>" +
          "<p class=\"analysis-note\">你的<strong>数据类型与类的定义</strong>基础掌握良好；<strong>薄弱点</strong>集中在封装与访问控制、继承与方法重写。</p>" +
          '<div class="weak-tags"><span class="weak-tag">封装与访问控制</span><span class="weak-tag">继承与方法重写</span></div>' +
          '<p class="analysis-note">已为你生成个性化学习路径：<b>基础章节可直接跳过</b>，从薄弱章节开始系统学习。路径见<b>左侧项目树</b>，点击章节即可打开讲解页。</p>' +
        "</div>";
      addMsg("bot", card);
      addMsg("bot", "<p>学习路径已就绪 👉 点击左侧项目下的章节开始学习。每个章节都配有知识点讲解，含视频资源的章节会提供跳转链接。</p>");

      state.pathReady = true;
      renderProjectTree();
      setInputEnabled(true);
      showSuggestions();
    }

    /* ================= 左栏项目树 ================= */
    function renderProjectTree() {
      if (!state.project) {
        treeEl.innerHTML =
          '<div class="tree-empty"><i data-lucide="folder-open"></i>' +
          "<div>还没有项目<br/>在右侧对话框输入学习目标，<br/>即可创建项目并生成学习路径</div></div>";
        icons();
        return;
      }
      const doneCount = LESSONS.filter((l) => l.status === "done").length;
      treeEl.innerHTML =
        '<div class="project-node open" id="project-node">' +
          '<button class="project-header" id="project-header">' +
            '<span class="chev"><i data-lucide="chevron-right"></i></span>' +
            '<span class="folder"><i data-lucide="folder"></i></span>' +
            '<span class="project-name">' + escapeHtml(state.project.name) + "</span>" +
            '<span class="project-meta">' + doneCount + "/" + LESSONS.length + "</span>" +
          "</button>" +
          '<ul class="path-list" id="path-list">' +
          LESSONS.map((l, i) => {
            const stateLabel = l.status === "done" ? "已完成" : l.status === "current" ? "学习中" : "待解锁";
            const icon = l.status === "done" ? '<i data-lucide="check"></i>'
              : l.status === "current" ? (i + 1)
              : '<i data-lucide="lock-keyhole"></i>';
            return '<li class="path-item ' + l.status + (state.currentLesson === i ? " active" : "") + '">' +
              '<button data-lesson="' + i + '">' +
                '<span class="path-state">' + icon + "</span>" +
                '<span class="path-copy"><small>' + l.num + " · " + l.tag + "</small><strong>" + l.title + "</strong></span>" +
                '<span class="path-duration">' + stateLabel + "</span>" +
              "</button></li>";
          }).join("") +
          "</ul></div>";
      icons();
      treeEl.querySelectorAll(".path-item button").forEach((b) => {
        b.onclick = () => openLesson(Number(b.dataset.lesson));
      });
      $("project-header").onclick = () => {
        document.getElementById("project-node").classList.toggle("open");
      };
    }

    /* ================= 中央讲解页 ================= */
    function openLesson(idx) {
      if (idx < 0 || idx >= LESSONS.length) return;
      state.currentLesson = idx;
      const l = LESSONS[idx];
      welcomeEl.hidden = true;
      lessonEl.hidden = false;
      $("crumb-project").textContent = state.project ? state.project.name : "项目";
      $("crumb-lesson").textContent = "第 " + l.num + " 章";
      $("lesson-tag").textContent = l.num + " · " + l.tag + (l.status === "done" ? " · 已完成" : l.status === "current" ? " · 当前" : " · 待解锁");
      $("lesson-title").textContent = l.title;
      $("lesson-body").innerHTML = "";

      l.body.forEach(([type, content]) => {
        if (type === "h3") {
          const h = document.createElement("h3");
          h.innerHTML = '<span class="dot"></span>' + escapeHtml(content);
          const card = document.createElement("div");
          card.className = "lesson-card";
          card.appendChild(h);
          $("lesson-body").appendChild(card);
        } else if (type === "p") {
          const p = document.createElement("p");
          p.textContent = content;
          $("lesson-body").lastElementChild.appendChild(p);
        } else if (type === "ul") {
          const ul = document.createElement("ul");
          content.split("|").forEach((li) => { const x = document.createElement("li"); x.textContent = li; ul.appendChild(x); });
          $("lesson-body").lastElementChild.appendChild(ul);
        } else if (type === "code") {
          const pre = document.createElement("pre");
          pre.className = "code-block";
          pre.innerHTML = content.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\/\//g, '<span class="cm">//</span>');
          $("lesson-body").lastElementChild.appendChild(pre);
        } else if (type === "table") {
          const table = document.createElement("table");
          table.className = "info-table";
          content.split("\n").forEach((row, ri) => {
            const tr = document.createElement("tr");
            row.split("|").forEach((cell) => {
              const tag = ri === 0 ? "th" : "td";
              const c = document.createElement(tag);
              c.textContent = cell;
              tr.appendChild(c);
            });
            table.appendChild(tr);
          });
          $("lesson-body").lastElementChild.appendChild(table);
        }
      });

      // 视频卡片
      if (l.video) {
        const card = document.createElement("div");
        card.className = "lesson-card";
        card.innerHTML =
          "<h3><span class=\"dot\"></span>视频讲解</h3>" +
          '<div class="video-card">' +
            '<span class="play"><i data-lucide="play"></i></span>' +
            "<div><strong>" + escapeHtml(l.video.title) + "</strong><small>外部视频资源 · 点击跳转观看</small></div>" +
            '<a href="' + l.video.url + '" target="_blank" rel="noopener"><i data-lucide="external-link"></i> 观看视频</a>' +
          "</div>";
        $("lesson-body").appendChild(card);
      }

      $("lesson-prev").disabled = idx === 0;
      $("lesson-next").disabled = idx === LESSONS.length - 1;
      $("lesson-mark").textContent = l.status === "done" ? "已完成 ✓" : "标记为已掌握";
      renderProjectTree();
      stageEl.scrollTop = 0;
      icons();
    }

    $("lesson-prev").onclick = () => openLesson(state.currentLesson - 1);
    $("lesson-next").onclick = () => openLesson(state.currentLesson + 1);
    $("lesson-mark").onclick = () => {
      const l = LESSONS[state.currentLesson];
      if (l.status !== "done") {
        l.status = "done";
        $("lesson-mark").textContent = "已完成 ✓";
        renderProjectTree();
        addMsg("bot", "<p>已记录：<strong>" + l.title + "</strong> 标记为已掌握 👍 继续下一个章节吧。</p>");
      }
    };
    $("crumb-home").onclick = () => {
      lessonEl.hidden = true;
      welcomeEl.hidden = false;
      state.currentLesson = -1;
      renderProjectTree();
    };

    /* ================= 输入与新建 ================= */
    $("send-btn").onclick = () => {
      const t = $("chat-textarea").value.trim();
      if (!t || $("send-btn").disabled) return;
      sendGoal(t);
    };
    $("chat-textarea").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send-btn").click(); }
    });
    $("chat-textarea").addEventListener("input", function () {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 120) + "px";
    });

    $("new-project-btn").onclick = () => {
      if (!state.project || confirm("新建项目将重置当前演示，继续？")) {
        state.project = null;
        state.pathReady = false;
        state.currentLesson = -1;
        messagesEl.innerHTML = "";
        welcomeEl.hidden = false;
        lessonEl.hidden = true;
        closeQuiz();
        renderProjectTree();
        boot();
      }
    };

    /* ================= 启动 ================= */
    renderProjectTree();
    boot();
  </script>
</body>
</html>
